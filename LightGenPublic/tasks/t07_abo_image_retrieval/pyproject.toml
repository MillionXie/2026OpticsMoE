[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightgen-abo"
version = "0.1.0"
description = "Independent high-alpha optical product retrieval research snapshot"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers==4.57.3", "tokenizers==0.22.2", "numpy==1.26.4", "Pillow==12.2.0", "matplotlib>=3.8", "safetensors==0.8.0"]

[tool.setuptools.packages.find]
include = ["lightgen_abo*"]
