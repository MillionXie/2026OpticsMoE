# P04-S: validation-only screen for post-deployment adaptation.
# Every group starts from the same ideal BP endpoint; only the deployment-time
# backward rule differs. Test data remain untouched during this screen.
formal_config: FixedFeedbackSFT/projects/d2nn_cifar10_high_performance_optical_backbone/configs/formal_a13_high_performance.yaml
output_dir: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/p04_deployment_adaptation_screen
source_method: bp
evaluation_split: validation

methods: [noft, bp, fa_pretrained, fa_random]
training_seeds: [2026]
deployment_seeds: [9101]

adaptation:
  epochs: 10
  phase_learning_rate: 0.0005
  electronic_learning_rate: 0.0005
  residual_learning_rate: 0.00025
  warmup_epochs: 1
  min_learning_rate_ratio: 0.10
  max_train_batches: null

conditions:
  - name: global_shift_0p125px
    phase_shift_pixels: 0.125
    phase_shift_geometry: global
  - name: global_shift_0p25px
    phase_shift_pixels: 0.25
    phase_shift_geometry: global
  - name: layerwise_shift_0p125px
    phase_shift_pixels: 0.125
    phase_shift_geometry: layerwise
  - name: layerwise_shift_0p25px
    phase_shift_pixels: 0.25
    phase_shift_geometry: layerwise
