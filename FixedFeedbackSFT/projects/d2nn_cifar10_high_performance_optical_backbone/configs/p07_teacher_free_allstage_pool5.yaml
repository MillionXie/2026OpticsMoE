# P07-A: teacher-free all-stage supervised backbone refinement.
# Start from the immutable P07-F epoch-5 encoder, replace the disposable
# classifier, and expose every optical stage directly to the ImageNet loss.
output_dir: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/p07_teacher_free_allstage_pool5
imagenet_config: experiments/optical_mlp_mixer_moe9_imagenet1k_clip_distill/configs/imagenet1k.json
architecture_config: FixedFeedbackSFT/projects/d2nn_cifar10_high_performance_optical_backbone/configs/imagenet_capacity_8x224.yaml
source_checkpoint: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/p05_misalignment_vaccination/seed_2026/best.pt
source_checkpoint_sha256: 5bd7889700f16eae112776f622b10cd52e59c064384558d85ae7be999b1aa8aa
source_checkpoint_load_mode: expanded
initial_checkpoint: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/p07_teacher_free_formal_linear/checkpoints/epoch_005.pt
initial_checkpoint_sha256: 0d35d64fa6f5905cef6c5e1ea4defd807d8275659a2c36e734462a0b92162775
initial_checkpoint_load_mode: encoder_only
model:
  selected_stage_indices: [0, 1, 2, 3, 4, 5, 6, 7]
  pool_size: 5
  projection_dim: 512
  num_classes: 1000
  classifier_mode: descriptor_linear
  classifier_hidden_dim: 256
  classifier_conv_channels: 64
  classifier_dropout: 0.0
loss:
  supervised_ce_weight: 1.0
  feature_cosine_weight: 0.0
  clip_logit_kd_weight: 0.0
  contrastive_weight: 0.0
  contrastive_temperature: 0.07
  distill_temperature: 2.0
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  batch_mix_probability: 0.5
optimizer:
  phase_learning_rate: 3.0e-5
  residual_learning_rate: 1.5e-5
  head_learning_rate: 3.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  gradient_clip_norm: 5.0
  warmup_steps: 5000
  minimum_learning_rate_ratio: 0.05
training:
  seed: 2026
  # Calibrate the new disposable head without perturbing the epoch-5 encoder,
  # then perform 29 full exact-BP epochs through all eight optical stages.
  head_warmup_epochs: 1
  joint_epochs: 29
  train_samples_per_class: null
  validation_samples_per_class: 50
  batch_size: 32
  validation_batch_size: 64
  num_workers: 6
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle_block_size: 4096
  use_amp: true
  amp_initial_scale: 256
  amp_growth_interval: 100000
  log_interval_batches: 250
  checkpoint_interval_epochs: 1
  max_train_batches: null
  max_validation_batches: null
  run_final_ablations: true
gates:
  validation_top1_min: 0.15
  clip_cosine_min: -1.0
  optical_gate_min: 0.5
  optical_disruption_relative_drop_min: 0.3
