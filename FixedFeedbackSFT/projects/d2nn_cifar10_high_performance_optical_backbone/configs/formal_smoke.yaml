# End-to-end engineering check for all four formal groups; not a scientific result.
output_dir: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/formal_smoke

optical:
  canvas_size: 128
  input_channels: 3
  num_stages: 8
  wavelength_m: 5.32e-7
  pixel_size_m: 1.6e-5
  propagation_distance_m: 0.05
  phase_init_std: 0.05
  layernorm_eps: 1.0e-5
  normalize_branch_rms: true
  residual:
    mode: constrained
    main_init: 0.50
    main_min: 0.35
  readout:
    pool_size: 8
    hidden_dim: 512
    dropout: 0.10

data:
  dataset: cifar10
  root: data/cifar100_fixed_feedback/torchvision
  validation_per_class: 500
  split_seed: 42
  num_workers: 2
  pin_memory: true
  augmentation:
    crop_padding: 4
    horizontal_flip: true

optimizer:
  phase_learning_rate: 0.0005
  residual_learning_rate: 0.0003
  electronic_learning_rate: 0.0003
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  warmup_epochs: 1
  min_learning_rate_ratio: 0.10

training:
  epochs: 1
  seeds: [99]
  batch_size: 4
  evaluation_batch_size: 8
  label_smoothing: 0.10
  use_amp: true
  log_interval_batches: 1
  checkpoint_interval_epochs: 1
  gradient_clip_norm: 5.0
  max_train_batches: 2
  max_evaluation_batches: 2
  init_checkpoint: ""
  load_backbone_only: false

formal:
  source_checkpoint: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/a03_cifar100_pretrain/seed_1234/best.pt
  source_checkpoint_sha256: f632c57cf851805090686cda81d4b4a0efc07b02c91dc0e0b63c00912247becc
  common_checkpoint: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/formal_smoke/common/head_warmup_best.pt
  head_warmup_seed: 98
  head_warmup_epochs: 1
  head_learning_rate: 0.001
  finetune_epochs: 1
  finetune_seeds: [99]
  phase_learning_rate: 0.0005
  residual_learning_rate: 0.0003
  electronic_learning_rate: 0.0003
  warmup_epochs: 1
  min_learning_rate_ratio: 0.10
  checkpoint_interval_epochs: 1
