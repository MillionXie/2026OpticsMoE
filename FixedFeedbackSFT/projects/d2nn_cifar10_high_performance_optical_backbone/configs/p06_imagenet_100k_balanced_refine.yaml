# P06-S3: conservative anti-collapse continuation with an epoch-0 fallback.
output_dir: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/p06_imagenet_100k_balanced_refine
imagenet_config: experiments/optical_mlp_mixer_moe9_imagenet1k_clip_distill/configs/imagenet1k.json
architecture_config: FixedFeedbackSFT/projects/d2nn_cifar10_high_performance_optical_backbone/configs/formal_a13_high_performance.yaml
source_checkpoint: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/p05_misalignment_vaccination/seed_2026/best.pt
source_checkpoint_sha256: 5bd7889700f16eae112776f622b10cd52e59c064384558d85ae7be999b1aa8aa
initial_checkpoint: FixedFeedbackSFT/runs/d2nn_cifar10_high_performance_optical_backbone/p06_imagenet_100k_screen/checkpoints/best.pt
initial_checkpoint_sha256: 8212bb07c453b9d8723ce1e52e0c75c57240095651110b3a6930d8704d3730b5

model:
  selected_stage_indices: [1, 3, 5, 7]
  pool_size: 4
  projection_dim: 512
  num_classes: 1000

loss:
  supervised_ce_weight: 1.0
  feature_cosine_weight: 1.0
  clip_logit_kd_weight: 0.5
  # S2 weight 1.0 destroyed cosine/classification faster than it recovered
  # instance structure. Keep a weak anti-collapse pressure instead.
  contrastive_weight: 0.1
  contrastive_temperature: 0.07
  distill_temperature: 2.0
  label_smoothing: 0.1

optimizer:
  # Continue below the S1 peak LR to avoid erasing its 3.84% endpoint.
  phase_learning_rate: 3.0e-5
  residual_learning_rate: 3.0e-5
  head_learning_rate: 1.5e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  gradient_clip_norm: 5.0
  warmup_steps: 0
  minimum_learning_rate_ratio: 0.10

training:
  seed: 2026
  head_warmup_epochs: 0
  joint_epochs: 24
  train_samples_per_class: 100
  validation_samples_per_class: 10
  batch_size: 32
  validation_batch_size: 64
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  log_interval_batches: 100
  checkpoint_interval_epochs: 2
  max_train_batches: null
  max_validation_batches: null
  run_final_ablations: true

gates:
  validation_top1_min: 0.10
  clip_cosine_min: 0.65
  optical_gate_min: 0.50
  optical_disruption_relative_drop_min: 0.30
