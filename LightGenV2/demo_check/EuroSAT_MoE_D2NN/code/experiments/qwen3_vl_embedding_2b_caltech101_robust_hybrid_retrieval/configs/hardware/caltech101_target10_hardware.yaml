# Four-plane physical replay for the target-10 robust-hybrid checkpoint.
model_config: ../release/caltech101_target10_finetune.yaml
checkpoint: ../../runs/caltech101_target10_finetune_epoch60/ema_last_checkpoint.pt
output_dir: ../../hardware_sessions/caltech101_target10_epoch60
selection:
  # Initial bench trial: all 3 gallery references plus 10 fixed test queries
  # per class. Use --selection-mode test_only for the full held-out set.
  mode: selected_test
  queries_per_sku: 10
  prefer_correct_queries: false
  results_csv: null
slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  amplitude_encoding: {mode: positive_percentile, percentile: 95.0, gamma: 0.65}
  phase_transform: {flip_vertical: true}
capture:
  roi_xywh: null
  flip_vertical: true
  flip_horizontal: true
  registration_mode: nearest_resize
  dark_level: 0.0
  binning_factor: 2
  binning_reduction: mean
simulation: {tensor_dtype: float16, save_complex_fields: false}
artifacts: {profile: full, clean_output_before_prepare: false, copy_checkpoint: false}
adaptation:
  run_tag: target10_hardware_v1
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0
  skus_per_batch: 10
  samples_per_sku: 2
  lambda_kd: 0.25
  lambda_retrieval: 0.5
  lambda_prototype: 1.0
  temperature: 0.07
  prototype_temperature: 0.07
  gradient_clip_norm: 1.0
  include_test_split: false
