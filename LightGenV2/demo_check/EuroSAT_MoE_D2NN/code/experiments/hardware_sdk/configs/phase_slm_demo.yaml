# Meadowlark Blink HDMI is controlled independently for now; the Grocery
# acquisition pipeline still asks the operator to load each phase plane.
sdk_root: ../vendor_sdk/phase_meadowlark
lut_file: ../vendor_sdk/phase_meadowlark/LUT Files/slm3_at532.lut
patterns_dir: ../generators/slm_patterns/generated/slm956_calibration/phase_bmp
pattern_glob: "*.bmp"
output_dir: ../artifacts/demos/phase_slm

expected_resolution_wh: [1920, 1200]
display_seconds: 2.0
repeat_count: 1
max_patterns: null

# The common Grocery hardware exports are already flipped. Calibration masks
# generated by generators/slm_patterns are not flipped by default.
flip_vertical: false

# This adds the measured correction modulo 256 before Write_image(). Disable it
# when measuring the raw panel or validating the correction map itself.
apply_wavefront_correction: true
wavefront_correction_file: ../vendor_sdk/phase_meadowlark/WFC Files/slm7001_at532_WFC.bmp
