  electronic_checkpoint: null
  electronic_sha256: null
  optical_checkpoint: null
  optical_sha256: null
  stage_a_checkpoint: ../../runs/caltech101_warmstart5_stage1_optical_calibration/ema_best_train_loss_checkpoint.pt

training:
