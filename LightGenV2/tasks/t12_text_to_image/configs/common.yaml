seed: 42
dataset:
  data_dir: ../dataset/abo_single_object_v1
  image_size: 224
qwen:
  model: Qwen/Qwen3-VL-2B-Instruct
  checkpoint: null
  hidden_size: 2048
vae:
  model: stabilityai/sd-vae-ft-mse
  checkpoint: null
  latent_channels: 4
  latent_size: 28
model:
  width: 192
  token_grid: 14
  style_dim: 256
  electronic_depth: 2
fusion:
  alpha_initial: 0.40
  alpha_minimum: 0.05
  alpha_maximum: 0.95
  rms_epsilon: 1.0e-6
training:
  batch_size: 32
  epochs: 80
  learning_rate: 2.0e-4
  weight_decay: 0.01
  num_workers: 4
  amp: true
loss:
  kl_weight: 0.002
  kl_warmup_epochs: 15
  free_bits: 0.02
