model:
  task: view
  image_size: 128
  text_dim: 2048
  condition_dim: 192
  widths: [48, 64, 96, 160]
  optical: true
  experts: 4
  top_k: 2
  residual_limit: 1.0
  maximum_skip: 0.75
fusion: {alpha_initial: 0.50, alpha_minimum: 0.40, alpha_maximum: 0.75, rms_epsilon: 1.0e-6}
training:
  batch_size: 32
  epochs: 25
  learning_rate: 1.0e-4
  phase_learning_rate: 4.0e-4
  weight_decay: 1.0e-4
  num_workers: 4
  amp: true
  adversarial_warmup_epochs: 4
  sample_every_epochs: 5
loss: {adversarial_weight: 0.01, reconstruction_weight: 12.0, edge_weight: 2.0, background_weight: 6.0}
