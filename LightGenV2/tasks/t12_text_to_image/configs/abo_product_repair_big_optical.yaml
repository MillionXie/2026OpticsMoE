model:
  optical_width: 224
  optical_grid: 8
  optical_experts: 4
  optical_top_k: 2
fusion:
  alpha_initial: 0.50
  alpha_minimum: 0.40
  alpha_maximum: 0.75
  rms_epsilon: 1.0e-6
training:
  image_size: 256
  batch_size: 1
  gradient_accumulation: 4
  epochs: 12
  learning_rate: 2.0e-5
  optical_learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  detail_weight: 0.15
  num_workers: 4
  sample_every_epochs: 1
