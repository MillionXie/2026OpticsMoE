base_config: common.yaml
model:
  variant: lightgen_parallel
  optical_backend: audited_dc20
  decoder_depth: 4
training:
  batch_size: 16
  epochs: 60
loss:
  kl_weight: 0.01
  kl_warmup_epochs: 10
adversarial:
  enabled: true
  discriminator_width: 48
  learning_rate: 1.0e-4
  start_epoch: 5
  posterior_weight: 0.05
  prior_weight: 0.05
  feature_matching_weight: 0.10
  pixel_reconstruction_weight: 0.10
output_dir: ../runs/simulation/lightgen_parallel_gan_seed42
