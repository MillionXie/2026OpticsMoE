base_config: common.yaml
model:
  variant: qwen_vae_baseline
  optical_backend: none
  decoder_depth: 4
training:
  batch_size: 16
  epochs: 25
loss:
  kl_weight: 0.01
  kl_warmup_epochs: 5
adversarial:
  enabled: true
  discriminator_width: 48
  learning_rate: 1.0e-4
  start_epoch: 0
  posterior_weight: 0.05
  prior_weight: 0.05
  feature_matching_weight: 0.10
  pixel_reconstruction_weight: 0.10
output_dir: ../runs/simulation/qwen_vae_baseline_gan_seed42
