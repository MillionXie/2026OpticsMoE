base_config: temporal_multivideo16x4_rank.yaml
output_dir: LightGenV2/tasks/t06_video_quality_assessment/runs/simulation/multivideo16x4_polish_readout_s172
random_seed: 172

# Freeze optical motion through zero LR while allowing the same inference graph
# and readout/electronic routes to adapt. This is not an optical-off model.
training:
  initialization_checkpoint: LightGenV2/tasks/t06_video_quality_assessment/runs/simulation/multivideo16x4_rank_s163/best_checkpoint.pt
  epochs: 60
  learning_rate: 0.00012
  phase_learning_rate: 0.0
  router_phase_learning_rate: 0.0

loss:
  ranking_weight: 0.50
  correlation_weight: 1.40
  soft_target_weight: 1.00
  router_balance_weight: 0.0
  router_importance_weight: 0.0
  router_diversity_weight: 0.0
  slot_consistency_weight: 0.10

