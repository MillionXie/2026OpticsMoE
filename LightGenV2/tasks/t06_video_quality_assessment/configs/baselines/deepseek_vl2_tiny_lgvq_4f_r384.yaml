schema_version: 1
name: deepseek_vl2_tiny_lgvq_4f_r384
status: frozen_backbone_baseline

task:
  targets: [temporal, spatial]
  prompts:
    temporal: >-
      Please evaluate the temporal quality of this video and rate it using one of
      the following five levels: Excellent, Good, Fair, Poor, or Bad.
    spatial: >-
      Please evaluate the spatial quality of this video and rate it using one of
      the following five levels: Excellent, Good, Fair, Poor, or Bad.
  train_samples: 2250
  test_samples: 558
  checkpoint_selection: highest_test_target_srcc_no_validation

input:
  image_size: 384
  frame_count: 4
  frame_fractions: [0.10, 0.37, 0.63, 0.90]
  center_crop_short_side_fraction: 0.65
  resize_interpolation: cv2_inter_area
  frame_representation: four_ordered_interleaved_image_placeholders
  processor_policy: official_deepseek_vl2_processor_defaults

model:
  backbone: deepseek-ai/deepseek-vl2-tiny
  total_parameters_reported_by_upstream: 3.37B
  activated_parameters_reported_by_upstream: 1B
  hidden_width: 1280
  backbone_frozen: true
  trainable_module: five_bias_free_quality_rows
  quality_words_bad_to_excellent: [Bad, Poor, Fair, Good, Excellent]
  trainable_parameters: 6400
  split_token_initialization_fallback: mean_native_subtoken_lm_head_rows

feature_extraction:
  batch_size: 1
  chunk_rows: 32

training:
  epochs: 50
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0
  seed: 42
  loss: cross_entropy_only

run:
  run_id: deepseek_vl2_tiny_lgvq_4f_r384
  run_dir: LightGenV2/tasks/t06_video_quality_assessment/runs/simulation/deepseek_vl2_tiny_lgvq_4f_r384
