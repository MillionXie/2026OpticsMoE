router_hardware_measurement:
  background_subtraction: false
  uncalibrated_capture_metric: raw_capture_fraction
  quality_gates:
    maximum_saturated_pixel_fraction: 0.02
    minimum_p99_uint8: 8.0
    minimum_dynamic_range_uint8: 4.0
    minimum_topk_probability_margin: 0.01
lightgen:
  task: t08_abo_image_text_retrieval
  model_variant: optical_router_scale_matched_moe
  selection:
    use_periodic_test: true
    test_interval_epochs: 5
    primary_checkpoint: best_checkpoint.pt
    criterion: maximum periodically observed EMA test Top-1
    test_metrics_used_for_selection: true
balanced_fusion:
  mode: scale_matched_convex
  equation: rE*((1-alpha)*E/rE + alpha*O/rO)/rms(mixture); RMS statistics are detached
    per sample over all valid tokens and channels
  alpha_min: 0.01
  alpha_max: 0.95
  alpha_initial: 0.055
  rms_epsilon: 1.0e-06
  detach_scale_statistics: true
d2nn:
  phase_size: 224
  phase_layers_per_modality: 2
  trainable_phase_parameters_per_modality: 100352
  matching_target: top_k * expert_size^2 per modality
