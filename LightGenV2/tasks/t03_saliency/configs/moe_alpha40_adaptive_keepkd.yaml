base_config: moe_alpha40_rfstage_control.yaml
# Preserve the verified .85812016 best, alpha, geometry and all inference modules.
training:
  student_epochs: 30
  student_learning_rate: 0.000003
  phase_learning_rate: 0.00005
  router_learning_rate: 0.00001
  dense_readout_learning_rate: 0.000005
  dense_head_learning_rate: 0.00001
  staged:
    warmup_epochs: 0
    polish_start: 21
  adaptive_plateau:
    enabled: true
    patience: 3
    min_delta: 0.0001
    factor: 0.5
    max_reductions: 2
    min_epoch: 6
distillation:
  initial_weight: 0.6
  final_weight: 0.6
  end_epoch: 10
batching:
  student_batch_size: 32
  inference_batch_size: 48
  num_workers: 2
protocol:
  test_interval_epochs: 2
output_dir: ../runs/simulation/moe_alpha40_adaptive_keepkd_seed42
