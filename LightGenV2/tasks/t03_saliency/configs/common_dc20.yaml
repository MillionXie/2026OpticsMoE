base_config: ../../t02_keypoint_detection/configs/common_dc20.yaml

dataset:
  data_root: ../../../../data/SALICON
  download: true
  train_limit: null
  validation_limit: null
  materialize_density_maps: true
  density_sigma_px: 19.0

batching:
  student_batch_size: 12
  inference_batch_size: 24
  num_workers: 4

training:
  student_epochs: 60
  student_learning_rate: 0.0001
  phase_learning_rate: 0.006
  router_learning_rate: 0.0005
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  amp_enabled: true
  random_seed: 42
  log_interval_batches: 100

loss:
  kl_weight: 1.0
  cc_weight: 0.5
  sim_weight: 0.25
  nss_weight: 0.1
  router_balance_weight: 0.08
  router_importance_weight: 0.02
  router_hard_load_balance_weight: 0.50
  ccd_operating_point_weight: 0.02
  phase_dc_weight: 0.005

augmentation:
  enabled: true
  crop_scale_min: 0.90
  horizontal_flip_probability: 0.5
  brightness_jitter: 0.10
  contrast_jitter: 0.10

saliency_head:
  projection_dim: 128
  decoder_channels: [96, 64, 32, 16]
  groupnorm_groups: 8

artifact_cache_dir: ../../../../cache/qwen3_vl_embedding_2b_salicon_lightgen
output_dir: ../runs/simulation/placeholder
