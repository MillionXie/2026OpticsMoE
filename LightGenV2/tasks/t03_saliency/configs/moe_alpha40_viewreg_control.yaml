base_config: moe_alpha40_cffn_control.yaml
# Earlier .85468765 checkpoint: before repeated no-augmentation KD fine-tunes.
training:
  initialization_checkpoint: ../runs/simulation/moe_alpha40_refine_weakaug_seed42/best_checkpoint.pt
