  brightness_jitter: 0.05
  contrast_jitter: 0.05
  end_epoch: 60
distillation:
  initial_weight: 0.6
  final_weight: 0.6
  end_epoch: 60
protocol:
  test_interval_epochs: 5
output_dir: ../runs/simulation/moe_alpha40_viewreg_control_seed42
