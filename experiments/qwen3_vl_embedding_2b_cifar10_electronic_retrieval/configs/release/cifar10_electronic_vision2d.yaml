base_config: ../../../qwen3_vl_embedding_2b_caltech101_electronic_retrieval/configs/release/caltech101_target10_electronic_vision2d.yaml

dataset:
  dataset_root: ../../../../opticalmoe_experiments/data
  download: true
  use_all_categories: false
  selected_skus:
    - airplane
    - automobile
    - bird
    - cat
    - deer
    - dog
    - frog
    - horse
    - ship
    - truck
  gallery_images_per_sku: 3
  train_limit_per_sku: null
  test_limit_per_sku: null
  reserve_test_before_train: true

qwen:
  instruction: Represent this image for CIFAR-10 image-to-image retrieval.

training:
  epochs: 12
  teacher_enabled: false
  lambda_kd: 0.0
  lambda_relational_kd: 0.0
  lambda_teacher_gallery: 0.0
  evaluate_test_each_epoch: true

batching:
  batch_size: 30
  pk_skus_per_batch: 10
  pk_images_per_sku: 3
  optimizer_steps_per_epoch: null

output_dir: ../../runs/cifar10_electronic_vision2d_no_deepstack
