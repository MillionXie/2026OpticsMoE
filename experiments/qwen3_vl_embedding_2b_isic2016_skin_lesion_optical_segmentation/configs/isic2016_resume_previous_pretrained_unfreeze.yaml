source:
  architecture_config: ../../qwen3_vl_embedding_2b_coco_duts_vision_optical_moe16_pretrain/configs/coco_duts_pretrain.yaml

initialization:
  # The previous 100-epoch run trained only the segmentation head because the
  # optical modules were recursively frozen through visual.blocks[0]. Reuse
  # its ISIC-adapted head and DUTS backbone, reset the optimizer, and now
  # genuinely fine-tune the complete task-specific path.
  mode: isic_checkpoint_finetune
  pretrained_checkpoint: ../runs/isic2016_skin_lesion_coco_duts_pretrained/checkpoints/isic_student_best_train_loss.pt
  load_segmentation_head: true

dataset:
  data_root: ../../../data/ISIC2016
  auto_download: true
  remove_archives_after_extract: true
  expected_train_samples: 900
  expected_test_samples: 379
  train_limit: null
  test_limit: null
  resize_mode: stretch
  urls:
    train_images: https://isic-archive.s3.amazonaws.com/challenges/2016/ISBI2016_ISIC_Part1_Training_Data.zip
    train_masks: https://isic-archive.s3.amazonaws.com/challenges/2016/ISBI2016_ISIC_Part1_Training_GroundTruth.zip
    test_images: https://isic-archive.s3.amazonaws.com/challenges/2016/ISBI2016_ISIC_Part1_Test_Data.zip
    test_masks: https://isic-archive.s3.amazonaws.com/challenges/2016/ISBI2016_ISIC_Part1_Test_GroundTruth.zip

batching:
  train_batch_size: 8
  inference_batch_size: 8
  num_workers: 8

training:
  head_warmup_epochs: 0
  joint_finetune_epochs: 50
  optical_learning_rate: 0.00002
  phase_learning_rate: 0.002
  router_learning_rate: 0.00005
  recombiner_learning_rate: 0.00005
  head_learning_rate: 0.0001
  weight_decay: 0.0
  amp_enabled: true
  random_seed: 42
  log_interval_batches: 25
  checkpoint_interval_epochs: 5
  evaluate_test_each_epoch: true

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  soft_iou_weight: 0.75
  boundary_weight: 0.25
  router_balance_weight: 0.03
  router_importance_weight: 0.0
  phase_dc_weight: 2.0

augmentation:
  enabled: true
  crop_scale_min: 0.92
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  brightness_jitter: 0.08
  contrast_jitter: 0.08
  rotation_degrees: 10.0

visualization:
  interval_epochs: 5
  sample_count: 12

output_dir: ../runs/isic2016_skin_lesion_resume_pretrained_unfrozen
