base_config: base.yaml

# Optimization trial E:
# keep the fixed one-shot RGB quadrant input, but replace the sparse
# ten-region NLL training objective with a normalized full detector-plane MSE.
# The physical output and Top-k prediction still use the same ten regions.
input:
  encoding: rgb_quadrant_amplitude

loss:
  type: detector_plane_mse
  scale: 100.0
  normalize_detector_plane_mse: true
  detector_plane_mse_normalization_eps: 1.0e-8

training:
  optimizer: adam
  learning_rate: 0.01
  weight_decay: 0.0
  epochs: 120
  class_balanced_sampling: false
  include_gallery_in_training: false

augmentation:
  enabled: true
  crop_scale_min: 0.90
  brightness_jitter: 0.10
  contrast_jitter: 0.10
  rotation_degrees: 5.0

output_dir: ../runs/grocery10_d2nn2_opt_rgb_detector_mse
