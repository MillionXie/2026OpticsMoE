base_config: base.yaml

# Optimization trial D:
# retain RGB/luminance information and use each deployment gallery exemplar
# as ten independently augmented training anchors per epoch. The optical model
# remains two phase planes with no trainable electronics or distillation.
input:
  encoding: rgb_quadrant_amplitude

training:
  optimizer: adam
  learning_rate: 0.01
  weight_decay: 0.0
  epochs: 120
  class_balanced_sampling: false
  include_gallery_in_training: true
  gallery_repeat_factor: 10

augmentation:
  enabled: true
  crop_scale_min: 0.90
  brightness_jitter: 0.12
  contrast_jitter: 0.12
  rotation_degrees: 7.0

output_dir: ../runs/grocery10_d2nn2_opt_rgb_gallery
