base_config: base.yaml

# Optimization trial B:
# stronger view and illumination variation, still without horizontal flip,
# MixUp, CutMix, blur, erasing, electronics, distillation, or OEO nonlinearity.
training:
  optimizer: adamw
  learning_rate: 0.005
  weight_decay: 0.0005
  epochs: 120
  class_balanced_sampling: false

augmentation:
  enabled: true
  crop_scale_min: 0.80
  brightness_jitter: 0.20
  contrast_jitter: 0.20
  rotation_degrees: 12.0

output_dir: ../runs/grocery10_d2nn2_opt_fullcoverage_strong
