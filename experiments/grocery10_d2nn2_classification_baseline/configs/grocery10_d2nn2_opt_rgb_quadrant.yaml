base_config: base.yaml

# Optimization trial C:
# preserve fixed RGB information in a single 224x224 scalar amplitude SLM:
# top-left R, top-right G, bottom-left B, bottom-right luminance.
# This adds no trainable electronics, extra optical shot, MoE, or distillation.
input:
  encoding: rgb_quadrant_amplitude

training:
  optimizer: adam
  learning_rate: 0.01
  weight_decay: 0.0
  epochs: 120
  class_balanced_sampling: false

augmentation:
  enabled: true
  crop_scale_min: 0.90
  brightness_jitter: 0.10
  contrast_jitter: 0.10
  rotation_degrees: 5.0

output_dir: ../runs/grocery10_d2nn2_opt_rgb_quadrant
