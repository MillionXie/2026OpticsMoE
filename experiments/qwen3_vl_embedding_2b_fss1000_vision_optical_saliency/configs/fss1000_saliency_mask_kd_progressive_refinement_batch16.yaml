base_config: fss1000_saliency_mask_kd_augmented_finetune_batch16.yaml

# Head-only diagnostic: retain the trained optical representation and router
# exactly, then learn a zero-initialized 14->28->56->112->224 decoder branch.
segmentation_head:
  student_refinement_enabled: false
  student_progressive_refinement_enabled: true

training:
  freeze_student_optical_core: true
  student_epochs: 30
  student_learning_rate: 0.0005

loss:
  # The frozen router cannot respond to these regularizers.
  router_balance_weight: 0.0
  router_importance_weight: 0.0

output_dir: ../runs/fss1000_saliency_mask_kd_progressive_refinement_batch16
