base_config: fss1000_saliency.yaml

# Conservative second-stage fine-tuning:
# - starts from the completed ground-truth-only optical student;
# - restores model weights but deliberately creates a fresh optimizer;
# - distills only the frozen electronic teacher's final mask;
# - uses a lower LR to reduce the late-epoch oscillation seen in the baseline.
training:
  student_epochs: 30
  student_learning_rate: 0.0003
  router_learning_rate: 0.0001
  phase_learning_rate: 0.0001
  log_interval_batches: 250

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  mask_kd_weight: 0.5
  mask_kd_temperature: 1.0
  router_balance_weight: 0.03
  router_importance_weight: 0.005

mask_kd:
  teacher_checkpoint: ../runs/fss1000_saliency/checkpoints/teacher_best_train_loss.pt
  teacher_mask_cache: ../runs/fss1000_saliency/teacher_mask_cache

student_initialization:
  checkpoint: ../runs/fss1000_saliency/checkpoints/student_best_train_loss.pt

# Cached teacher masks correspond to the unaugmented 224x224 geometry.
# Disabling geometry augmentation is required to keep every teacher pixel aligned.
augmentation:
  enabled: false

output_dir: ../runs/fss1000_saliency_mask_kd_finetune
