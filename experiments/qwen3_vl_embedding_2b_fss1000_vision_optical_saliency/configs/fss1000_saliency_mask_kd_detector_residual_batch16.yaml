base_config: fss1000_saliency_mask_kd_augmented_finetune_batch16.yaml

# Transformer-style optical residual diagnostic. The trained CCD feature is
# the identity path; the trained optical input field supplies a small,
# trainable bypass that preserves patch-level spatial information.
segmentation_head:
  student_refinement_enabled: false
  student_progressive_refinement_enabled: false
  student_detector_residual:
    enabled: true
    identity_scale_init: 1.0
    input_scale_init: 0.1
    identity_scale_trainable: false
    input_scale_trainable: true

training:
  freeze_student_optical_core: true
  freeze_student_base_head: false
  student_epochs: 30
  student_learning_rate: 0.0003

loss:
  router_balance_weight: 0.0
  router_importance_weight: 0.0

output_dir: ../runs/fss1000_saliency_mask_kd_detector_residual_batch16
