base_config: fss1000_saliency_mask_kd_augmented_finetune.yaml

# 24 GB RTX 4090 throughput profile. This preserves the model/loss/data
# semantics; only batch construction and the independent output directory differ.
batching:
  student_batch_size: 16
  inference_batch_size: 16
  num_workers: 8

training:
  log_interval_batches: 125

output_dir: ../runs/fss1000_saliency_mask_kd_augmented_finetune_batch16
