base_config: fss1000_saliency_mask_kd_augmented_finetune_batch16.yaml

# Directly optimize the target overlap metric and emphasize thin contours,
# while retaining the original BCE, Dice, aligned teacher mask KD, and optics.
loss:
  bce_weight: 1.0
  dice_weight: 1.0
  soft_iou_weight: 0.75
  boundary_weight: 0.25
  mask_kd_weight: 0.5
  router_balance_weight: 0.03
  router_importance_weight: 0.005

segmentation_head:
  student_refinement_enabled: false
  student_progressive_refinement_enabled: false
  student_detector_residual:
    enabled: false

training:
  freeze_student_optical_core: false
  freeze_student_base_head: false
  student_epochs: 30

output_dir: ../runs/fss1000_saliency_mask_kd_iou_boundary_batch16
