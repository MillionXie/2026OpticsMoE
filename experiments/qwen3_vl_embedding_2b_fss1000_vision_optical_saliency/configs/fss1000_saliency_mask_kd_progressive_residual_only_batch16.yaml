base_config: fss1000_saliency_mask_kd_progressive_refinement_batch16.yaml

# Preserve both the trained optical representation and original decoder.
# Only the zero-initialized multi-resolution residual branch is optimized.
training:
  freeze_student_optical_core: true
  freeze_student_base_head: true
  student_learning_rate: 0.001

output_dir: ../runs/fss1000_saliency_mask_kd_progressive_residual_only_batch16
