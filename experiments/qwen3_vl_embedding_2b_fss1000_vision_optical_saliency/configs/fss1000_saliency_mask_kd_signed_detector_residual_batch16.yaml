base_config: fss1000_saliency_mask_kd_detector_residual_batch16.yaml

# Transformer-style residual using the signed adapter latent before Softplus.
# This retains information that the nonnegative optical-loading field removes.
segmentation_head:
  student_detector_residual:
    enabled: true
    source: signed_adapter_latent
    identity_scale_init: 1.0
    input_scale_init: 0.1
    identity_scale_trainable: false
    input_scale_trainable: true

output_dir: ../runs/fss1000_saliency_mask_kd_signed_detector_residual_batch16
