base_config: ../../../qwen3_vl_embedding_2b_caltech101_four_layer_optical_retrieval_10cm_warmstart5/configs/release/stage2_joint_sealed_test.yaml

# The old 5% gate logits are loaded strictly.  Reinterpreting those raw logits
# under this 1% bound starts near 1.5%, then leaves all four gates trainable.
hybrid:
  initial_electronic_checkpoint: null
  freeze_electronic: false
  minimum_optical_fusion: 0.01
  initial_fusion: 0.015

continuation:
  checkpoint: ../../../qwen3_vl_embedding_2b_caltech101_four_layer_optical_retrieval_10cm_warmstart5/runs/caltech101_warmstart5_stage2_joint_sealed_test/ema_best_train_loss_checkpoint.pt
  sha256: 6a27f54d8c869cce46150583383a127b0ba47b3d34503f5753aa23974ac1e55d
  variant: common

training:
  # 8 x 12 updates is a short continuation, not a restart from Qwen/electronic
  # initialization.  Test data remains sealed during all four comparisons.
  epochs: 8
  learning_rate: 0.00002
  adapter_learning_rate: 0.00001
  readout_learning_rate: 0.00001
  phase_learning_rate: 0.03
  router_learning_rate: 0.0001
  gradient_clip_norm: 1.0
  lambda_kd: 0.0
  lambda_relational_kd: 0.0
  lambda_ret: 1.0
  lambda_gallery: 1.0
  lambda_teacher_gallery: 0.0
  lambda_router_balance: 0.05
  lambda_router_importance: 0.005
  lambda_ccd_operating_point: 0.02
  phase_dc: {enabled: true, weight: 0.01, start_epoch: 1}
  phase_focus: {enabled: true, warmup_epochs: 0, interval_epochs: 2}
  phase_diagnostics:
    gradient_measure_interval_batches: 4
    motion_warning_epoch: 2
    motion_warning_threshold_rad: 0.10
    preview_interval_epochs: 1
  evaluate_test_each_epoch: false
  resume_optimizer_state: false
  ema_decay: 0.995
  learning_rate_schedule: cosine
  learning_rate_warmup_ratio: 0.05

batching:
  batch_size: 30
  pk_skus_per_batch: 10
  pk_images_per_sku: 3
  optimizer_steps_per_epoch: 12

language_optical:
  perturbation:
    # Keep the existing displacement/gain vaccination identical in every arm.
    max_shift_pixels: 16
    phase_shift_pixels: 16
    ccd_shift_pixels: 16
    gain_min: 0.4
    gain_max: 2.5
    offset_fraction: 0.05
    read_noise_fraction: 0.015
    ccd_noise:
      distribution: truncated_biased_gaussian
      mean_fraction: 0.03
      std_fraction: 0.025
      min_fraction: -0.02
      max_fraction: 0.08

output_dir: ../../runs/override_in_variant

