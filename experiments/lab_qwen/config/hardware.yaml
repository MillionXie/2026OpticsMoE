# EDIT THESE FIELDS before formal acquisition:
#   camera.device_roi_xywh
#   camera.exposure_us
#   camera.detector_geometry.contract_file + expected_file_sha256
#   amplitude_slm.lut_file (30 C or 70 C)

input_dir: ../work/amplitude
output_dir: ../work/ccd
log_dir: ../work/log
output_extension: .png
settle_delay_ms: 200
confirm_before_start: true
max_files: null
require_phase_mask: true
phase_mask_file: null

paths:
  masks_dir: ../calib/exposure
  results_dir: ../results/exposure

amplitude_slm:
  driver: meadowlark_pcie
  sdk_path: ../../hardware_sdk/vendor_sdk/amplitude_meadowlark
  board_number: 1
  expected_resolution_wh: [1024, 1024]
  width: 1024
  height: 1024
  expected_bit_depth: 8
  pixel_pitch_um: 17.0
  timeout_ms: 5000
  wait_for_trigger: false
  flip_immediate: false
  output_pulse: false
  preload: false
  blank_on_close: true
  lut_file: ../../hardware_sdk/vendor_sdk/amplitude_meadowlark/LUT Files/slm7930_at532_30C.lut

phase_slm:
  driver: manual
  width: 1920
  height: 1200
  expected_resolution_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  center_xy: [980.0, 590.0]

amplitude_roi:
  width: 478
  height: 478
  center_x: 511.5
  center_y: 511.5

camera:
  driver: tucam
  sdk_path: ../../hardware_sdk/vendor_sdk/camera_tucam_mosaic
  camera_index: 0
  timeout_ms: 10000
  config_file: null
  auto_exposure: false
  exposure_us: 5000.0
  analog_gain: null
  anti_flicker_hz: null
  resolution_mode: null
  require_device_roi: true
  # REQUIRED: replace with [left, top, width, height], all divisible by four.
  device_roi_xywh: null
  saved_frame_size_wh: [478, 478]
  saved_frame_resize_mode: auto
  saved_frame_bit_depth: 8
  saved_frame_input_range: [0, 65535]
  warmup_frames: 3
  discard_frames_after_display: 1
  detector_geometry:
    # Keep false only while locating the four points. Formal capture requires true.
    enabled: false
    contract_file: null
    expected_file_sha256: null

calibration:
  marker_size_px: 40
  marker_sigma_px: 9
  roi_outline_width_px: 3

exposure_calibration:
  exposure_times_us: [5000]
  gray_point_count: 32
  frames_per_gray: 3
  preview_gray_values: [0, 128, 255]
  patch_size_px: 400
  patch_inner_size_px: 320
  edge_taper_px: 40
  measurement_window_size_px: 256
  saturation_fraction_warning: 0.001
