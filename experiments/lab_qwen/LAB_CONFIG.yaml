# 实验人员唯一需要编辑的配置文件。
# LUT 只写文件名；文件放在：
# experiments/hardware_sdk/vendor_sdk/amplitude_meadowlark/LUT Files/
amplitude_lut_filename: slm7930_at532-70c-pixel-2.lut

# 新 LUT 标定。默认 64 灰度 × 3 帧采集旧 LUT，再用生成的新 LUT 重复 64×3 验证。
# field_amplitude 表示网络 BMP 灰度是光场振幅，因此目标 CCD 强度为 (gray/255)^2。
# 如仅想让 CCD 强度随灰度线性变化，可显式改成 linear_intensity 做对照。
# output_lut_filename 必须与当前 amplitude_lut_filename 不同，程序绝不会覆盖旧 LUT。
amplitude_lut_calibration:
  gray_point_count: 64
  frames_per_gray: 3
  target_transfer: field_amplitude
  output_lut_filename: slm7930_at532-70c-pixel-2_linearized-amplitude.lut
  maximum_verification_intensity_rmse: 0.10
  maximum_verification_field_amplitude_rmse: 0.08
  maximum_verification_monotonic_violations: 2
  maximum_saturation_fraction: 0.001

# 单位：微秒。若亮度标定饱和，只修改这里，然后重新运行 prepare_lab。
camera_exposure_us: 5000.0

# 正式采集时序。程序先阻塞等待 Meadowlark 的 ImageWriteComplete，再等待
# formal_slm_settle_delay_ms，最后才向 CCD 请求图像。
# discard_frames_after_display：每次换 SLM 图后丢弃的相机流旧帧数。
# camera_warmup_frames：相机刚打开时只执行一次，不会每张图都执行。
# 曝光时间是 CCD 积分时间，不是额外的软件 sleep。
capture_timing:
  formal_slm_settle_delay_ms: 200
  discard_frames_after_display: 1
  camera_warmup_frames: 3

# MNIST 时序诊断：5 档等待 × 4 个固定数字 = 20 帧。每个数字都以最长等待帧为
# 参考；若报告显示 400 ms 仍未稳定，再扩大下面的等待列表。
timing_diagnostic:
  settle_delay_ms_values: [0, 50, 100, 200, 400]
  repeats_per_digit_and_delay: 1
  discard_frames_after_display: 1
  minimum_pcc_to_reference: 0.95
  maximum_gain_aligned_nmae: 0.15
  maximum_absolute_mean_ratio_error: 0.15
  maximum_saturation_fraction: 0.001
  minimum_p99_uint8: 16

# CCD 2048x2048 全传感器坐标，不要求是 4 的倍数。
# 标签必须按光场逻辑方向填写，不要按相机画面的左右重新命名。
# 当前光路左右镜像，因此逻辑 top_left 出现在画面右侧是正常的。
# 如果尚未测量，请把四项全部设为 null；不能只留部分 null。
logical_corners_full_sensor_xy:
  top_left: [1626, 281]
  top_right: [358, 285]
  bottom_right: [363, 1547]
  bottom_left: [1631, 1545]
