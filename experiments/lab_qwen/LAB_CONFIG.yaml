# 实验人员唯一需要编辑的配置文件。
# LUT 只写文件名；文件放在：
# experiments/hardware_sdk/vendor_sdk/amplitude_meadowlark/LUT Files/
amplitude_lut_filename: slm7930_at532_70C.lut

# 单位：微秒。若亮度标定饱和，只修改这里，然后重新运行 prepare_lab。
camera_exposure_us: 5000.0

# CCD 2048x2048 全传感器坐标，不要求是 4 的倍数。
# 标签必须按光场逻辑方向填写，不要按相机画面的左右重新命名。
# 当前光路左右镜像，因此逻辑 top_left 出现在画面右侧是正常的。
# 如果尚未测量，请把四项全部设为 null；不能只留部分 null。
logical_corners_full_sensor_xy:
  top_left: [1626, 281]
  top_right: [358, 285]
  bottom_right: [363, 1547]
  bottom_left: [1631, 1545]
