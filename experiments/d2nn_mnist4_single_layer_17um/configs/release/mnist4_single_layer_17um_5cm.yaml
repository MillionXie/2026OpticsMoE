dataset:
  root: ../../cache/mnist
  classes: [0, 1, 2, 3]
  download: true
  val_fraction: 0.10
  train_limit: null
  val_limit: null
  test_limit: null

optics:
  wavelength_nm: 532.0
  logical_pixel_pitch_um: 17.0
  canvas_size: 518
  active_size: 478
  input_size: 400
  detector_distance_m: 0.05
  phase:
    parameterization: sigmoid
    init: zeros

detector:
  # Odd width puts detector centers at the exact half-pixel centers of the
  # four 239x239 quadrants of the 478x478 logical CCD ROI.
  size: 49

loss:
  # Two physically interpretable terms: discriminate the four detector regions
  # first, while retaining enough captured light for the real CCD.
  eps: 1.0e-8
  classification_weight: 1.0
  capture_weight: 0.2

training:
  optimizer: adam
  phase_learning_rate: 0.02
  min_learning_rate: 0.002
  epochs: 60
  batch_size: 256
  inference_batch_size: 256
  num_workers: 4
  random_seed: 42
  gradient_clip_norm: 5.0
  log_interval_batches: 20

hardware:
  amplitude_slm:
    size_wh: [1024, 1024]
    pixel_pitch_um: 17.0
    center_xy: [512.0, 512.0]
    # Current laboratory observation: BMP black is optically bright.
    invert_before_export: true
  phase_slm:
    size_wh: [1920, 1200]
    pixel_pitch_um: 8.0
    center_xy: [980.0, 590.0]
    flip_vertical: true
    flip_horizontal: false
  ccd:
    target_size: 478
  export_samples_per_class: 10

device: cuda
output_dir: ../../runs/mnist4_single_layer_17um_5cm
