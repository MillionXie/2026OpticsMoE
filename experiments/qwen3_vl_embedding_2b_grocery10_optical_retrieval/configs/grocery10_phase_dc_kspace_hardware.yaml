# Deployment package for the freshly trained phase-DC + k-space model.
# This is deliberately separate from grocery10_hardware_deployment.yaml, which
# remains pinned to the historical epoch-159 EMA checkpoint.
model_config: grocery10_phase_engaged.yaml
checkpoint: ../runs/qwen3_vl_embedding_2b_grocery10_phase_dc_kspace/best_train_loss_checkpoint.pt
output_dir: ../hardware_runs/grocery10_phase_dc_kspace_percentile98

selection:
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_phase_dc_kspace/retrieval_results.csv

slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0

  # Compute the scale from strictly positive pixels, so the intentionally
  # black 12/16 experts and spatial padding do not corrupt the percentile.
  # gamma=1 preserves all unclipped relative amplitudes. 98.0 clips only the
  # brightest 2% of positive pixels, but prevents those sparse outliers from
  # leaving most useful SLM pixels at very low gray levels.
  amplitude_encoding:
    mode: positive_percentile
    percentile: 98.0
    gamma: 1.0

capture:
  roi_xywh: null
  dark_level: 0.0

simulation:
  tensor_dtype: float16
  save_complex_fields: true
