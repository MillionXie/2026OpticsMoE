model_config: grocery10_moe4_latest.yaml
checkpoint: ../runs/qwen3_vl_embedding_2b_grocery10_moe4_hardware_robust/best_train_loss_checkpoint.pt
output_dir: ../hardware_sessions/grocery10_moe4_latest
selection:
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_moe4_hardware_robust/retrieval_results.csv
slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  amplitude_encoding: {mode: positive_percentile, percentile: 95.0, gamma: 0.65}
  phase_transform: {flip_vertical: true}
capture:
  # A full sensor frame may be used after setting [x,y,956,956].
  roi_xywh: null
  # Coordinate calibration switches. Applied after ROI crop and before nearest
  # registration / 2x2 electronic binning. Simulation tensors are never flipped.
  flip_vertical: true
  flip_horizontal: true
  # Crop first (when roi_xywh is set), then register any remaining sensor-size
  # mismatch to 956x956 with nearest-neighbor interpolation before 2x2 binning.
  registration_mode: nearest_resize
  dark_level: 0.0
  binning_factor: 2
  binning_reduction: mean
simulation: {tensor_dtype: float16, save_complex_fields: false}
artifacts: {profile: full, clean_output_before_prepare: true, copy_checkpoint: false}
automation:
  settle_delay_ms: 40
  confirm_each_phase_mask: true
  resume_existing_captures: true
  comparison_normalization: mean
  comparison_preview_count: 8
  devices:
    phase_slm: {driver: manual}
    amplitude_slm:
      driver: holoeye
      sdk_path: ../../hardware_sdk/amp_slm
      binary_folder: null
      expected_resolution_wh: [1920, 1080]
      minimum_refresh_hz: 59.0
      preload: true
      wait_until_visible: true
    camera:
      driver: dvp_subprocess
      sdk_path: ../../hardware_sdk/ccd/lib/linux/python3.5m/x64
      conda_env: dvp35
      camera_index: 0
      timeout_ms: 4000
      output_extension: .npy
      # A saved DVP .ini may be loaded first; explicit values below override it.
      config_file: null
      auto_exposure: false
      exposure_us: 10000.0
      analog_gain: 1.0
      anti_flicker_hz: 0
      resolution_mode: null
      device_roi_xywh: null
      warmup_frames: 3
      discard_frames_after_display: 1
adaptation:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.0
  skus_per_batch: 2
  samples_per_sku: 2
  lambda_kd: 1.0
  lambda_retrieval: 1.0
  temperature: 0.07
  gradient_clip_norm: 1.0
