base_config: grocery10_replaced_finetune.yaml

# Generalization continuation from the replacement-10 epoch-141
# minimum-training-loss checkpoint. This run keeps the optical architecture
# unchanged, uses a fresh optimizer, and writes to an independent output.
training:
  epochs: 100
  learning_rate: 0.00001
  router_learning_rate: 0.00002
  weight_decay: 0.0
  lambda_kd: 8.0
  lambda_ret: 1.0
  lambda_gallery: 0.25
  lambda_router_balance: 0.02
  lambda_router_importance: 0.005
  temperature: 0.07
  gallery_temperature: 0.15
  gallery_prototype_stop_gradient: true
  resume_optimizer_state: false
  evaluate_test_each_epoch: true
  log_interval_batches: 5

# Packaging-safe augmentation. There is deliberately no horizontal flip,
# MixUp, CutMix, blur, or erasing because package text and color are cues.
augmentation:
  enabled: true
  crop_scale_min: 0.85
  brightness_jitter: 0.15
  contrast_jitter: 0.15
  rotation_degrees: 7.0

output_dir: ../runs/qwen3_vl_embedding_2b_grocery10_replaced_continue_epoch141_augmented_kd
