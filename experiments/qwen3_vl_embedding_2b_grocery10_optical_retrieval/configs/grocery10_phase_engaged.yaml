base_config: grocery10_replaced_finetune.yaml

# Phase-engaged Grocery10 training.  This is intentionally separate from the
# historical best-reproduction chain: it tests whether task loss is carried by
# physically useful phase masks rather than being absorbed mainly by adapters,
# the retrieval readout, residual bypass, or a small subset of experts.
training:
  epochs: 100

  # Hybrid optical/electronic parameter groups have independent ownership.
  # CIFAR used 8e-3 for phase; use the same scale in this deliberately
  # aggressive phase-engagement run.
  learning_rate: 0.0002
  adapter_learning_rate: 0.0002
  readout_learning_rate: 0.0005
  router_learning_rate: 0.0002
  phase_learning_rate: 0.008
  weight_decay: 0.0
  gradient_clip_norm: 1.0

  lambda_kd: 5.0
  lambda_relational_kd: 0.25
  lambda_ret: 1.0
  lambda_gallery: 0.50
  lambda_teacher_gallery: 0.25
  lambda_router_balance: 0.05
  lambda_router_importance: 0.01
  # Per-plane |mean(exp(i*phase))|^2.  A weight of 5 makes the term visible
  # beside the task gradient; the exact-zero symmetry is broken by the small
  # Gaussian raw-phase initialization below.
  lambda_phase_dc: 0.001
  phase_dc_start_epoch: 1
  temperature: 0.07
  gallery_temperature: 0.15
  gallery_prototype_stop_gradient: true
  resume_optimizer_state: false
  evaluate_test_each_epoch: true
  log_interval_batches: 5

  # After five joint epochs, every second epoch is phase-only block-coordinate
  # descent.  Adapters/router/readout remain in the forward path but are frozen
  # for that epoch, so they cannot absorb that epoch's task gradient.
  phase_focus:
    enabled: true
    warmup_epochs: 5
    interval_epochs: 2

  phase_diagnostics:
    gradient_measure_interval_batches: 5
    motion_warning_epoch: 5
    motion_warning_threshold_rad: 0.01
    preview_interval_epochs: 5

optical:
  # The old residual let the vision hidden bypass a weak optical delta.  This
  # phase-engagement experiment deliberately forces the vision path through
  # the optical output while leaving Qwen patch/token/merger modules frozen.
  residual_enabled: false
  phase:
    parameterization: sigmoid
    init: zeros #small_normal
    init_std: 0.2
  # At 8 um sampling a 1 degree cutoff keeps only about 22% of the sampled
  # spectrum.  2 degrees keeps about 84%, suppressing unsupported corners
  # without turning the optical stack into an overly strong low-pass filter.
  k_space:
    enabled: true
    theta_max_deg: 1.0
  router:
    temperature: 2.0

output_dir: ../runs/qwen3_vl_embedding_2b_grocery10_phase_dc_kspace

batching:
  # The natural 10-SKU set yields only about 11 updates/epoch. Repeated PK
  # batches use fresh augmentation and increase optical optimization exposure.
  optimizer_steps_per_epoch: 100
