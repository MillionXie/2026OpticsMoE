# Final-plane physical CCD calibration for the rebuilt/flip-corrected MoE4 path.
# It continues from the prior 36% hardware checkpoint without overwriting it.
model_config: grocery10_moe4_latest.yaml
checkpoint: ../hardware_sessions/moe4_transfer_001/06_hardware_finetune/after_04_language_global__ccd_vhflip/checkpoints/best_train_loss.pt
output_dir: ../hardware_sessions/moe4_transfer_001
selection:
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_moe4_hardware_robust/retrieval_results.csv
slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  amplitude_encoding: {mode: positive_percentile, percentile: 95.0, gamma: 0.65}
  phase_transform: {flip_vertical: true}
capture:
  roi_xywh: null
  flip_vertical: true
  flip_horizontal: true
  registration_mode: nearest_resize
  dark_level: 0.0
  binning_factor: 2
  binning_reduction: mean
simulation: {tensor_dtype: float16, save_complex_fields: false}
artifacts: {profile: full, clean_output_before_prepare: false, copy_checkpoint: false}
automation:
  settle_delay_ms: 40
  confirm_each_phase_mask: true
  resume_existing_captures: true
  comparison_normalization: mean
  comparison_preview_count: 8
  devices:
    phase_slm: {driver: manual}
    amplitude_slm:
      driver: holoeye
      sdk_path: ../../hardware_sdk/amp_slm
      binary_folder: null
      expected_resolution_wh: [1920, 1080]
      minimum_refresh_hz: 59.0
      preload: true
      wait_until_visible: true
    camera:
      driver: dvp_subprocess
      sdk_path: ../../hardware_sdk/ccd/lib/linux/python3.5m/x64
      conda_env: dvp35
      camera_index: 0
      timeout_ms: 4000
      output_extension: .npy
      config_file: null
      auto_exposure: false
      exposure_us: 10000.0
      analog_gain: 1.0
      anti_flicker_hz: 0
      resolution_mode: null
      device_roi_xywh: null
      warmup_frames: 3
      discard_frames_after_display: 1
adaptation:
  run_tag: prototype_allsku_v1
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0
  # Each batch contains all ten measured gallery items and two disjoint query
  # views per SKU. Five batches therefore cover all 100 measured queries once.
  skus_per_batch: 10
  samples_per_sku: 2
  lambda_kd: 0.25
  lambda_retrieval: 0.5
  lambda_prototype: 1.0
  temperature: 0.07
  prototype_temperature: 0.07
  gradient_clip_norm: 1.0
