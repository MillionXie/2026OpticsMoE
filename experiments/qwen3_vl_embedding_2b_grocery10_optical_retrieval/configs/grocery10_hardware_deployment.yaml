# One canonical SLM/CCD deployment package for the strongest saved Grocery10
# checkpoint (epoch-159 EMA from the three-stage reproduction chain).
model_config: grocery10_best_reproduction_stage3_strong_ema.yaml
checkpoint: ../runs/qwen3_vl_embedding_2b_grocery10_replaced_continue_epoch141_stronger_augmentation_ema/ema_best_train_loss_checkpoint.pt
output_dir: ../hardware_runs/grocery10_epoch159_ema_stage_first

selection:
  # All registered gallery images are always included. Query samples are chosen
  # per SKU, preferring saved correctly retrieved/high-margin examples, then a
  # deterministic fallback. The exact order is persisted in play_order.csv.
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_replaced_continue_epoch141_stronger_augmentation_ema/retrieval_results.csv

slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0

capture:
  # Leave null when the acquisition program already exports the registered
  # 986x986 active CCD ROI. For a full-sensor image, set [x, y, 986, 986].
  # No implicit resize/crop is performed.
  roi_xywh: null
  dark_level: 0.0

simulation:
  # Complex detector-plane fields are simulation-only references. CCD files
  # remain separately named square-law intensity. FP16 reduces disk usage;
  # every electronic bridge still calculates in FP32.
  tensor_dtype: float16
  save_complex_fields: true
