model_config: grocery10_moe4_hardware_robust.yaml
checkpoint: ../runs/qwen3_vl_embedding_2b_grocery10_moe4_hardware_robust/best_train_loss_checkpoint.pt
output_dir: ../hardware_runs/grocery10_moe4_hardware_robust

selection:
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_moe4_hardware_robust/retrieval_results.csv

slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  amplitude_encoding:
    # Positive-only P95 clipping plus gamma<1 raises weak useful pixels while
    # preserving exact zeros in unselected experts, gaps, and token padding.
    mode: positive_percentile
    percentile: 95.0
    # 0.65 is intentionally brighter than the former 0.8 hardware mapping.
    # Do not add a non-zero floor: a floor would leak light into inactive areas.
    gamma: 0.65
  phase_transform:
    # Required by the current folded phase-SLM optical path.
    flip_vertical: true

capture:
  roi_xywh: null
  dark_level: 0.0
  binning_factor: 2
  binning_reduction: mean

simulation:
  tensor_dtype: float16
  save_complex_fields: false

artifacts:
  # Export only the SLM BMPs, theoretical CCD PNGs and compact manifests.
  profile: minimal
  clean_output_before_prepare: true
