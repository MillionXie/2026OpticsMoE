pipeline_version: 1
description: >-
  Canonical reproducible chain for the highest saved Grocery10 Optical Student:
  Grocery31 pretraining, replacement Grocery10 fine-tuning, then strong
  packaging-safe augmentation with EMA.

stages:
  - name: grocery31_pretrain
    config: grocery10_best_reproduction_stage1_grocery31.yaml
    resume_from: null
    checkpoint: best_train_loss_checkpoint.pt
  - name: replaced10_finetune
    config: grocery10_best_reproduction_stage2_replaced10.yaml
    resume_from: grocery31_pretrain
    checkpoint: best_train_loss_checkpoint.pt
  - name: strong_augmentation_ema
    config: grocery10_best_reproduction_stage3_strong_ema.yaml
    resume_from: replaced10_finetune
    checkpoint: ema_best_train_loss_checkpoint.pt

reuse_teacher_cache:
  from_stage: replaced10_finetune
  to_stage: strong_augmentation_ema

hardware_export:
  stage: strong_augmentation_ema
  sample_count: 8
  slm_pixel_pitch_um: 8.0
  amplitude_slm_size_wh: [1920, 1080]
  phase_slm_size_wh: [1920, 1200]
