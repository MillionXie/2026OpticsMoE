base_config: grocery10.yaml

# The first recovery attempt established a stable, non-collapsed checkpoint at
# epoch 57, but router_lr=1e-3 subsequently oscillated. Resume that checkpoint
# for epochs 58..150 (93 additional epochs) with conservative learning rates.
batching:
  batch_size: 30
  pk_skus_per_batch: 10
  pk_images_per_sku: 3

training:
  epochs: 93
  learning_rate: 0.00005
  router_learning_rate: 0.0001
  weight_decay: 0.0
  lambda_kd: 5.0
  lambda_ret: 1.0
  lambda_gallery: 0.5
  lambda_router_balance: 0.02
  lambda_router_importance: 0.005
  temperature: 0.07
  resume_optimizer_state: false
  evaluate_test_each_epoch: true
  log_interval_batches: 5

optical:
  router:
    temperature: 2.0
