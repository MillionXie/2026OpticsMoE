# Hardware deployment for the separately trained MoE4/superpixel2 model.
model_config: grocery10_phase_dc_kspace_moe4_superpixel2.yaml
checkpoint: ../runs/qwen3_vl_embedding_2b_grocery10_phase_dc_kspace_moe4_superpixel2/best_train_loss_checkpoint.pt
output_dir: ../hardware_runs/grocery10_phase_dc_kspace_moe4_superpixel2

selection:
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_phase_dc_kspace_moe4_superpixel2/retrieval_results.csv

slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  amplitude_encoding:
    mode: positive_percentile
    percentile: 98.0
    gamma: 1.0

capture:
  # The 478x478 logical active field is 956x956 on the physical 8 um grid.
  # For a full-sensor capture set [x,y,956,956] after geometric calibration.
  roi_xywh: null
  dark_level: 0.0
  binning_factor: 2
  binning_reduction: mean

simulation:
  tensor_dtype: float16
  save_complex_fields: true
