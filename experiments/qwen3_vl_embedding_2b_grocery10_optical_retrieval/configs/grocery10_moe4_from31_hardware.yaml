# Hardware export/session for the improved Grocery31 -> target-10 MoE4 EMA.
# This starts a new physical session; it does not reuse CCD captures made with
# the older phase masks.
model_config: optimization/grocery10_moe4_from31_strong_ema.yaml
checkpoint: ../runs/qwen3_vl_embedding_2b_grocery10_moe4_from31_epoch40_replay/ema_last_checkpoint.pt
output_dir: ../hardware_sessions/moe4_from31_ema_001
selection:
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_moe4_from31_epoch40_replay/retrieval_results.csv
slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  amplitude_encoding: {mode: positive_percentile, percentile: 95.0, gamma: 0.65}
  phase_transform: {flip_vertical: true}
capture:
  roi_xywh: null
  flip_vertical: true
  flip_horizontal: true
  registration_mode: nearest_resize
  dark_level: 0.0
  binning_factor: 2
  binning_reduction: mean
simulation: {tensor_dtype: float16, save_complex_fields: false}
artifacts: {profile: full, clean_output_before_prepare: true, copy_checkpoint: false}
automation:
  settle_delay_ms: 40
  confirm_each_phase_mask: true
  resume_existing_captures: true
  comparison_normalization: mean
  comparison_preview_count: 8
  devices:
    phase_slm: {driver: manual}
    amplitude_slm:
      driver: holoeye
      sdk_path: ../../hardware_sdk/vendor_sdk/amplitude_holoeye
      binary_folder: null
      expected_resolution_wh: [1920, 1080]
      minimum_refresh_hz: 59.0
      preload: true
      wait_until_visible: true
    camera:
      driver: dvp_subprocess
      sdk_path: ../../hardware_sdk/vendor_sdk/camera_dvp_legacy/lib/linux/python3.5m/x64
      conda_env: dvp35
      camera_index: 0
      timeout_ms: 4000
      output_extension: .npy
      config_file: null
      auto_exposure: false
      exposure_us: 10000.0
      analog_gain: 1.0
      anti_flicker_hz: 0
      resolution_mode: null
      device_roi_xywh: null
      warmup_frames: 3
      discard_frames_after_display: 1
adaptation:
  run_tag: prototype_allsku_v1
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0
  skus_per_batch: 10
  samples_per_sku: 2
  lambda_kd: 0.25
  lambda_retrieval: 0.5
  lambda_prototype: 1.0
  temperature: 0.07
  prototype_temperature: 0.07
  gradient_clip_norm: 1.0
