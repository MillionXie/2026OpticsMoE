# Canonical release model: 2x2 / 4 experts and 2x2 CCD integration.
# Simulation uses 16 um sampling; hardware export uses nearest-neighbor 2x
# expansion to the physical 8 um SLM. DC suppression is deliberately disabled.
dataset:
  dataset_root: ../../../../data/GroceryStoreDataset
  download: true
  download_url: https://github.com/marcusklasson/GroceryStoreDataset/archive/refs/heads/master.zip
  selected_skus:
    - God-Morgon-Orange-Juice
    - Tropicana-Golden-Grapefruit
    - Arla-Ecological-Medium-Fat-Milk
    - Oatly-Natural-Oatghurt
    - Oatly-Oat-Milk
    - Alpro-Blueberry-Soyghurt
    - Alpro-Shelf-Soy-Milk
    - Yoggi-Strawberry-Yoghurt
    - God-Morgon-Apple-Juice
    - Tropicana-Mandarin-Morning
  merge_official_validation_into_train: true
  train_limit_per_sku: null
  test_limit_per_sku: null
  gallery_images_per_sku: 1

qwen:
  model_id: Qwen/Qwen3-VL-Embedding-2B
  cache_dir: null
  local_files_only: false
  instruction: Represent this product image for image-to-image product retrieval.
  processor_min_pixels: 50176
  processor_max_pixels: 50176
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda

retrieval: {image_size: 224, embedding_dim: 64, gallery_aggregation: mean_prototype}
batching:
  teacher_batch_size: 4
  batch_size: 30
  pk_skus_per_batch: 10
  pk_images_per_sku: 3
  inference_batch_size: 4
  num_workers: 4
  optimizer_steps_per_epoch: 100

training:
  epochs: 100
  learning_rate: 0.0002
  adapter_learning_rate: 0.0002
  readout_learning_rate: 0.0005
  weight_decay: 0.0
  lambda_kd: 5.0
  lambda_relational_kd: 0.25
  lambda_ret: 1.0
  lambda_gallery: 0.5
  lambda_teacher_gallery: 0.25
  lambda_router_balance: 0.05
  lambda_router_importance: 0.01
  phase_dc: {enabled: false, weight: 0.0, start_epoch: 1}
  temperature: 0.07
  gallery_temperature: 0.15
  gallery_prototype_stop_gradient: true
  router_learning_rate: 0.0002
  phase_learning_rate: 0.004
  gradient_clip_norm: 1.0
  phase_focus: {enabled: true, warmup_epochs: 5, interval_epochs: 2}
  phase_diagnostics:
    gradient_measure_interval_batches: 20
    motion_warning_epoch: 5
    motion_warning_threshold_rad: 0.01
    preview_interval_epochs: 10
  ema_decay: null
  resume_optimizer_state: false
  random_seed: 42
  amp_enabled: true
  evaluate_test_each_epoch: true
  log_interval_batches: 5

augmentation: {enabled: true, crop_scale_min: 0.9, brightness_jitter: 0.1, contrast_jitter: 0.1, rotation_degrees: 5.0}
optical:
  input_adapter_dim: 224
  max_visual_tokens: 224
  max_language_tokens: 224
  vision_tap_stages: [1]
  native_pre_attention_enabled: false
  initialize_attention_from_teacher: false
  native_pre_attention_trainable: false
  residual_enabled: false
  geometry:
    canvas_size: 518
    active_size: 478
    expert_size: 224
    expert_pitch: 254
    num_experts: 4
    grid_rows: 2
    grid_cols: 2
    layers_per_expert: 1
  router:
    top_k: 2
    pool_size: 14
    temperature: 2.0
    input_layernorm_enabled: true
    input_layernorm_eps: 1.0e-5
    amplitude_weight_domain: amplitude
    input_normalization: none
  physics:
    wavelength_nm: 532.0
    pixel_pitch_um: 16.0
    inter_layer_distance_m: 0.05
    last_expert_to_global_distance_m: 0.05
    global_to_detector_distance_m: 0.05
  phase:
    parameterization: sigmoid
    init: zeros
    init_std: 0.0
    dropout_mode: none
    dropout_p: 0.0
  k_space: {enabled: true, theta_max_deg: 0.65}
  oeo:
    enabled: true
    per_expert_enabled: true
    elementwise_affine: false
    hard_route_mask: true
    reapply_routing_weights: true
    detector_integration_factor: 2
    layernorm_eps: 1.0e-5
    nonlinearity: relu
  detector:
    output_size: 224
    layernorm_eps: 1.0e-5
    layernorm_affine: false
    layernorm_scope: per_token
    nonlinearity: relu

visualization: {sample_count: 8}
output_dir: ../../runs/release_moe4_from_scratch
