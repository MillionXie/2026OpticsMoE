model_config: grocery10_moe16_best.yaml
checkpoint: ../runs/qwen3_vl_embedding_2b_grocery10_replaced_continue_epoch141_stronger_augmentation_ema/ema_best_train_loss_checkpoint.pt
output_dir: ../hardware_sessions/grocery10_moe16_best
selection:
  queries_per_sku: 10
  prefer_correct_queries: true
  results_csv: ../runs/qwen3_vl_embedding_2b_grocery10_replaced_continue_epoch141_stronger_augmentation_ema/retrieval_results.csv
slm:
  amplitude_size_wh: [1920, 1080]
  phase_size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  amplitude_encoding: {mode: positive_percentile, percentile: 95.0, gamma: 0.65}
  phase_transform: {flip_vertical: true}
capture:
  roi_xywh: null
  dark_level: 0.0
  binning_factor: 1
  binning_reduction: mean
simulation: {tensor_dtype: float16, save_complex_fields: false}
artifacts: {profile: full, clean_output_before_prepare: true, copy_checkpoint: false}
automation:
  settle_delay_ms: 40
  confirm_each_phase_mask: true
  resume_existing_captures: true
  comparison_normalization: mean
  comparison_preview_count: 8
  devices:
    phase_slm: {driver: manual}
    amplitude_slm:
      driver: holoeye
      sdk_path: ../sdk/amp_slm
      # The uploaded files currently contain only the Python wrapper. Point
      # this at a folder containing libholoeye_slmdisplaysdk.so.
      binary_folder: null
    camera:
      # The uploaded Linux binary targets Python 3.5, so acquisition runs in a
      # persistent vendor subprocess while Qwen/post-processing stays in 3.11.
      driver: dvp_subprocess
      sdk_path: ../sdk/ccd/lib/linux/python3.5m/x64
      conda_env: dvp35
      camera_index: 0
      timeout_ms: 4000
      output_extension: .npy
