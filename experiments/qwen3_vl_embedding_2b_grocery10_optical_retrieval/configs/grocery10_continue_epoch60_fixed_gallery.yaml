base_config: grocery10.yaml

# Continue the ten effective recovery epochs (51..60) through epoch 150.
# The Student gallery is still distilled every batch, but it is detached only
# inside gallery CE so the prototype target does not chase the query branch.
batching:
  batch_size: 30
  pk_skus_per_batch: 10
  pk_images_per_sku: 3

training:
  epochs: 90
  learning_rate: 0.00002
  router_learning_rate: 0.00005
  weight_decay: 0.0
  lambda_kd: 5.0
  lambda_ret: 1.0
  lambda_gallery: 0.25
  lambda_router_balance: 0.02
  lambda_router_importance: 0.005
  temperature: 0.07
  gallery_temperature: 0.15
  gallery_prototype_stop_gradient: true
  resume_optimizer_state: false
  evaluate_test_each_epoch: true
  log_interval_batches: 5

optical:
  router:
    temperature: 2.0
