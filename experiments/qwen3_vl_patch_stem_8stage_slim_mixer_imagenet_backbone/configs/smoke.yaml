output_dir: experiments/qwen3_vl_patch_stem_8stage_slim_mixer_imagenet_backbone/runs/smoke
imagenet_config: experiments/optical_mlp_mixer_moe9_imagenet1k_clip_distill/configs/imagenet1k.json
stem_checkpoint: experiments/qwen3_vl_patch_stem_8stage_optical_imagenet_backbone/assets/qwen3_vl_static_stem_224.pt
model:
  canvas_size: 224
  optical_channels: 3
  num_stages: 8
  token_dim: 224
  num_classes: 1000
  head_hidden_dim: 448
  phase_init_std: 0.10
  optical_gate_init: 0.60
  optical_gate_min: 0.50
  mixer_width: 96
  mixer_expansion: 2.0
  mixer_kernel_size: 3
  mixer_dropout: 0.10
  mixer_spatial_gate_init: 0.10
  mixer_channel_gate_init: 0.10
  residual_scale_init: 0.10
  residual_scale_max: 0.25
  optical_parameter_fraction_scope: backbone_excluding_task_head
  minimum_optical_parameter_fraction: 0.50
optimizer:
  phase_learning_rate: 7.0e-3
  adapter_learning_rate: 5.0e-4
  residual_learning_rate: 3.5e-4
  head_learning_rate: 9.0e-4
  weight_decay: 5.0e-4
  warmup_epochs: 0
  minimum_learning_rate_ratio: 0.05
  phase_gradient_clip_norm: 2.0
  electronic_gradient_clip_norm: 5.0
loss:
  label_smoothing: 0.10
  mixup_alpha: 0.20
  cutmix_alpha: 1.0
  batch_mix_probability: 0.50
training:
  seed: 2026
  epochs: 1
  batch_size: 2
  validation_batch_size: 2
  num_workers: 2
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle_block_size: 4096
  use_amp: true
  amp_initial_scale: 256
  amp_growth_interval: 100000
  log_interval_batches: 1
  checkpoint_interval_epochs: 1
  max_train_batches: 2
  max_validation_batches: 2
  run_final_ablations: false
