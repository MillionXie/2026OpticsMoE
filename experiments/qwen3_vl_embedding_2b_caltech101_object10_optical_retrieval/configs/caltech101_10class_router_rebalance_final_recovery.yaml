base_config: caltech101_10class_router_rebalance_final_calibration.yaml

# Router is fixed after the one-epoch calibration. The optical path adapts to
# the newly used experts under stronger semantic distillation.
training:
  epochs: 5
  learning_rate: 0.000005
  adapter_learning_rate: 0.00002
  readout_learning_rate: 0.00005
  router_learning_rate: 0.0
  phase_learning_rate: 0.001
  router_load_bias_update_rate: 0.0
  lambda_kd: 12.0
  lambda_relational_kd: 0.10
  resume_optimizer_state: false

output_dir: ../runs/caltech101_10class_router_rebalance_final_epoch56

