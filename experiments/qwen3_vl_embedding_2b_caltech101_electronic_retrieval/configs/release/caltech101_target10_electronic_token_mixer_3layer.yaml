base_config: caltech101_target10_electronic.yaml

# Archived configuration for the original V2 run that reached >80% while it
# was still training. Keep it separate so its checkpoints remain reproducible.
electronic:
  width: 192
  layers: 3
  expansion: 2.0
  dropout: 0.10
  initial_residual_weight: 0.10
  pooling: mean_max
  deepstack_enabled: true
  token_mixer:
    enabled: true
    kernel_size: 5

training:
  teacher_enabled: false
  lambda_kd: 0.0
  lambda_relational_kd: 0.0
  lambda_teacher_gallery: 0.0

output_dir: ../../runs/caltech101_target10_electronic_token_mixer
