base_config: caltech101_target10_electronic.yaml

# Archived 2+2 mixer control with the original single frozen DeepStack merger.
electronic:
  width: 192
  layers: 2
  expansion: 2.0
  dropout: 0.10
  initial_residual_weight: 0.10
  pooling: mean_max
  deepstack_enabled: true
  token_mixer:
    enabled: true
    kernel_size: 5

training:
  teacher_enabled: false
  lambda_kd: 0.0
  lambda_relational_kd: 0.0
  lambda_teacher_gallery: 0.0

output_dir: ../../runs/caltech101_target10_electronic_token_mixer_2layer
