# Teacher MATLAB square-window quadratic phase, adapted to the current SLMs.
output_dir: ../calib/fresnel_10cm

wavelength_nm: 532.0
propagation_cm: 10.0

amplitude_slm:
  size_wh: [1024, 1024]
  pixel_pitch_um: 17.0

phase_slm:
  size_wh: [1920, 1200]
  pixel_pitch_um: 8.0
  center_xy: [980.0, 590.0]
  flip_vertical: true
  flip_horizontal: false

target_field:
  size_px: 478
  pixel_pitch_um: 17.0

lens_window_phase_px:
  1: 403
  4: 160
  9: 160

simulation:
  pad_size: 2048
  log_floor_db: -50.0

