source:
  # Defines the exact three-stage MoE16/Qwen/CCD architecture.
  architecture_config: ../../qwen3_vl_embedding_2b_coco_duts_vision_optical_moe16_pretrain/configs/coco_duts_pretrain.yaml
  # This is the full DUTS checkpoint: optical core + CCD recombiner + saliency head.
  duts_checkpoint: ../../qwen3_vl_embedding_2b_coco_duts_vision_optical_moe16_pretrain/runs/coco_duts_vision_optical_moe16_pretrain/checkpoints/duts_student_best_train_loss.pt

dataset:
  data_root: ../../../data/FSS-1000
  download: true
  download_source: auto
  download_file_id: 16TgqOeI_0P41Eh3jWQlxlRXG9KIqtMgI
  huggingface_dataset_id: nobg/FSS-1000
  huggingface_endpoint: https://hf-mirror.com
  official_test_list_url: https://raw.githubusercontent.com/HKUSTCV/FSS-1000/master/fss_test_set.txt
  train_class_limit: null
  test_class_limit: null
  images_per_class_limit: null

batching:
  train_batch_size: 4
  inference_batch_size: 4
  num_workers: 8

training:
  # First calibrate the already pretrained segmentation head to FSS masks.
  head_warmup_epochs: 3
  # Then jointly fine-tune with conservative backbone learning rates.
  joint_finetune_epochs: 47
  optical_learning_rate: 0.00005
  phase_learning_rate: 0.001
  recombiner_learning_rate: 0.0001
  head_learning_rate: 0.0005
  weight_decay: 0.0
  amp_enabled: true
  random_seed: 42
  log_interval_batches: 125
  checkpoint_interval_epochs: 10
  evaluate_test_each_epoch: true

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  soft_iou_weight: 0.75
  boundary_weight: 0.25
  router_balance_weight: 0.03
  router_importance_weight: 0.0
  phase_dc_weight: 2.0

augmentation:
  enabled: true
  crop_scale_min: 0.90
  horizontal_flip_probability: 0.5
  brightness_jitter: 0.10
  contrast_jitter: 0.10
  # FSS includes many thin structures; avoid interpolation damage by default.
  rotation_degrees: 0.0

visualization:
  interval_epochs: 5
  sample_count: 12

output_dir: ../runs/fss1000_saliency_coco_duts_pretrained_moe16
