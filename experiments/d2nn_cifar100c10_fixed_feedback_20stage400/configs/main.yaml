# Formal fixed-feedback experiment. All BP/FA methods must use this exact file.
output_dir: experiments/d2nn_cifar100c10_fixed_feedback_20stage400/runs/main

optical:
  canvas_size: 400
  num_stages: 20
  wavelength_m: 5.32e-7
  pixel_size_m: 1.6e-5
  propagation_distance_m: 0.05
  phase_parameterization: sigmoid
  # raw_phase=0 -> physical phase=pi. Do not randomize between methods.
  phase_init: zeros
  layernorm_eps: 1.0e-5
  residual:
    # Identity-dominant initialization preserves information through 20 OEO
    # stages. Both positive softmax weights remain trainable with standard BP.
    main_init: 0.1
    skip_init: 0.9
  readout:
    pool_size: 20
    hidden_dim: 128
    # The 100-way head is retained during ten-class downstream fine-tuning.
    num_output_classes: 100

data:
  root: data/cifar100_fixed_feedback
  torchvision_root: data/cifar100_fixed_feedback/torchvision
  cifar100c_root: data/cifar100_fixed_feedback/CIFAR-100-C
  cifar100c_url: https://zenodo.org/records/3555552/files/CIFAR-100-C.tar?download=1
  selected_classes:
    - apple
    - bicycle
    - bus
    - butterfly
    - clock
    - dolphin
    - forest
    - lion
    - rocket
    - telephone
  # The same base-image split is reused for every corruption, preventing leakage.
  corruptions: [gaussian_noise, contrast, motion_blur]
  severity: 3
  split:
    train_per_class: 60
    validation_per_class: 20
    test_per_class: 20
    seed: 42
  num_workers: 8
  pin_memory: true
  # 15k rotating samples/epoch: every three epochs cover the full 45k pretrain set.
  # 80 epochs correspond to about 26.7 full passes over the 45k training subset.
  pretrain_samples_per_epoch: 15000
  augmentation:
    pretrain_crop_padding: 4
    pretrain_horizontal_flip: true
    finetune_crop_padding: 2
    finetune_horizontal_flip: true

optimizer:
  # Identical parameter groups are used by BP, FA-pretrained and FA-random.
  phase_learning_rate: 0.01
  electronic_learning_rate: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  gradient_clip_norm: null

training:
  pretrain_epochs: 80
  finetune_epochs: 50
  # Measured on RTX 4090: BP batch 128 uses about 12.6 GiB; FA batch 64 about 5.0 GiB.
  pretrain_batch_size: 128
  finetune_batch_size: 64
  pretrain_seed: 42
  finetune_seeds: [1234, 2345, 3456]
  log_interval_batches: 100
  evaluation_interval_epochs: 1
  checkpoint_interval_epochs: 10
  diagnostic_epochs: [0, 1, 5, 10, 20, 30, 40, 50]
  use_amp: false
