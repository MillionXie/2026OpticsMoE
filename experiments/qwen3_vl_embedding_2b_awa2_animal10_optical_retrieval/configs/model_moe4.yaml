# Shared physical/model definition for AwA2 all-50 pretraining and target-10 adaptation.
dataset:
  dataset_root: ../../../data/AwA2
  download: true
  download_url: https://cvml.ista.ac.at/AwA2/AwA2-data.zip
  download_timeout_sec: 300
  # The extracted JPEG tree is retained; remove the 13-GB ZIP afterwards.
  delete_archive_after_extract: true
  use_all_classes: false
  selected_classes:
    - antelope
    - grizzly+bear
    - killer+whale
    - beaver
    - dalmatian
    - persian+cat
    - horse
    - german+shepherd
    - zebra
    - dolphin
  # Stable SHA256 ordering is applied independently within every class.
  # gallery and query are disjoint from train before either stage begins.
  test_fraction: 0.20
  gallery_images_per_class: 3
  minimum_images_per_class: 10
  train_limit_per_class: null
  test_limit_per_class: null

qwen:
  model_id: Qwen/Qwen3-VL-Embedding-2B
  cache_dir: null
  teacher_cache_source: null
  local_files_only: false
  instruction: Represent this animal image for image-to-image species retrieval.
  processor_min_pixels: 50176
  processor_max_pixels: 50176
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda

retrieval:
  image_size: 224
  embedding_dim: 64
  gallery_aggregation: mean_prototype

batching:
  teacher_batch_size: 4
  batch_size: 30
  pk_classes_per_batch: 10
  pk_images_per_class: 3
  inference_batch_size: 4
  num_workers: 4
  optimizer_steps_per_epoch: 300

training:
  epochs: 30
  learning_rate: 0.0002
  adapter_learning_rate: 0.0002
  readout_learning_rate: 0.0005
  router_learning_rate: 0.0002
  phase_learning_rate: 0.004
  weight_decay: 0.0
  lambda_kd: 8.0
  lambda_relational_kd: 0.10
  lambda_ret: 1.0
  lambda_gallery: 0.25
  lambda_teacher_gallery: 0.10
  lambda_router_balance: 0.02
  lambda_router_importance: 0.005
  lambda_router_response_consistency: 0.10
  phase_dc: {enabled: false, weight: 0.0, start_epoch: 1}
  temperature: 0.07
  gallery_temperature: 0.15
  gallery_prototype_stop_gradient: true
  gradient_clip_norm: 1.0
  phase_focus: {enabled: true, warmup_epochs: 5, interval_epochs: 2}
  phase_diagnostics:
    gradient_measure_interval_batches: 20
    motion_warning_epoch: 5
    motion_warning_threshold_rad: 0.01
    preview_interval_epochs: 10
  ema_decay: 0.99
  resume_optimizer_state: false
  random_seed: 42
  amp_enabled: true
  evaluate_test_each_epoch: true
  log_interval_batches: 20

augmentation:
  enabled: true
  crop_scale_min: 0.80
  brightness_jitter: 0.15
  contrast_jitter: 0.15
  rotation_degrees: 8.0
  horizontal_flip_probability: 0.5

optical:
  input_adapter_dim: 224
  max_visual_tokens: 224
  max_language_tokens: 224
  vision_tap_stages: [1]
  native_pre_attention_enabled: false
  initialize_attention_from_teacher: false
  native_pre_attention_trainable: false
  residual_enabled: false
  geometry:
    canvas_size: 518
    active_size: 478
    expert_size: 224
    expert_pitch: 254
    num_experts: 4
    grid_rows: 2
    grid_cols: 2
    layers_per_expert: 1
  router:
    top_k: 2
    pool_size: 14
    temperature: 2.0
    input_layernorm_enabled: true
    input_layernorm_eps: 1.0e-5
    amplitude_weight_domain: amplitude
    input_normalization: none
  physics:
    wavelength_nm: 532.0
    pixel_pitch_um: 16.0
    inter_layer_distance_m: 0.05
    last_expert_to_global_distance_m: 0.05
    global_to_detector_distance_m: 0.05
  phase:
    parameterization: sigmoid
    init: zeros
    init_std: 0.0
    dropout_mode: none
    dropout_p: 0.0
  k_space: {enabled: true, theta_max_deg: 0.65}
  oeo:
    enabled: true
    per_expert_enabled: true
    elementwise_affine: false
    hard_route_mask: true
    reapply_routing_weights: true
    preserve_response_amplitude: true
    response_gain_min: 0.25
    response_gain_max: 4.0
    detector_integration_factor: 2
    layernorm_eps: 1.0e-5
    nonlinearity: relu
  detector:
    output_size: 224
    layernorm_eps: 1.0e-5
    layernorm_affine: false
    layernorm_scope: per_token
    nonlinearity: relu

visualization: {sample_count: 12}
output_dir: ../runs/model_default
