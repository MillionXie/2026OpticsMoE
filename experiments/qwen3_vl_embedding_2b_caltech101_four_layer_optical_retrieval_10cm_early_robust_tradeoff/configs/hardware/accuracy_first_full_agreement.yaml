base_config: accuracy_first_full.yaml

agreement:
  # 5 fixed held-out examples per class plus deterministic artificial probes.
  task_test_per_class: 5
  repeat_task_keys: 2
  repeats_per_key: 3
  probe_seed: 42
  batch_size: 5
  relative_clip: 12.0
  log_compression: 1.0
  signal_energy_fraction: 0.99
  bootstrap_samples: 2000

output_dir: ../../runs/accuracy_first_full_agreement_metadata
