dataset:
  # Reuse the established cache rather than downloading MNIST for each project.
  root: ../../../d2nn_mnist4_single_layer_17um/cache/mnist
  classes: [0, 1, 2, 3]
  download: true
  val_fraction: 0.10
  train_limit: null
  val_limit: null
  test_limit: null

optics:
  wavelength_nm: 532.0
  logical_pixel_pitch_um: 17.0
  # 518 is the real usable field. 1024 is numerical zero padding only, used
  # to suppress circular FFT wrap-around during the longer 10 cm propagation.
  canvas_size: 518
  propagation_grid_size: 1024
  active_size: 478
  input_size: 400
  detector_distance_m: 0.10
  phase:
    parameterization: sigmoid
    init: zeros

detector:
  size: 49

loss:
  eps: 1.0e-8
  # Exact reference objective: loss = 100*MSE(output_intensity, target_mask).
  # The 100 factor lives in modeling.py, so the outer weight remains one.
  template_mse_weight: 1.0
  detector_ce_weight: 0.0

training:
  optimizer: adam
  # Match the successful reference notebook rather than the earlier 0.02 setup.
  phase_learning_rate: 0.01
  min_learning_rate: 0.001
  # The first 30-epoch run selected epoch 29, so it had not demonstrated
  # convergence.  Keep every other factor fixed and extend this clean run.
  epochs: 60
  batch_size: 64
  inference_batch_size: 64
  num_workers: 4
  random_seed: 42
  gradient_clip_norm: 5.0
  log_interval_batches: 50

hardware:
  amplitude_slm:
    size_wh: [1024, 1024]
    pixel_pitch_um: 17.0
    center_xy: [512.0, 512.0]
    # Corrected device contract: 255 is white/open; never invert it again.
    invert_before_export: false
  phase_slm:
    size_wh: [1920, 1200]
    pixel_pitch_um: 8.0
    center_xy: [980.0, 590.0]
    flip_vertical: true
    flip_horizontal: false
  ccd:
    target_size: 478
  demo_samples_per_class: 10
  evaluation_samples_per_class: 100
  export_subdir: hardware_export_10cm_normal_polarity

device: cuda
output_dir: ../../runs/mnist4_single_layer_17um_10cm_notebook_mse
