base_config: ../release/mnist4_single_layer_17um_10cm_notebook_mse.yaml

dataset:
  train_limit: 32
  val_limit: 16
  test_limit: 16

optics:
  # Keep the same physical 518 ROI but use the smallest non-wrapping smoke
  # canvas. Formal training always uses 1024.
  propagation_grid_size: 518

training:
  epochs: 1
  batch_size: 4
  inference_batch_size: 4
  num_workers: 0
  log_interval_batches: 2

hardware:
  demo_samples_per_class: 1
  evaluation_samples_per_class: 1

output_dir: ../../runs/smoke_mnist4_single_layer_17um_10cm_notebook_mse
