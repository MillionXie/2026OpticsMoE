# TUCam/Mosaic CCD 主配置。正式采集、0~9 校验、曝光检查和可选背景
# 都读取本文件；通常只需要修改 device_roi_xywh、曝光和 data 下的目录。

input_dir: ../data/amplitude_to_play
output_dir: ../data/ccd_captured
log_dir: ../artifacts/logs/tucam
digit_output_dir: ../artifacts/demos/tucam_digit_sequence
output_extension: .png
settle_delay_ms: 200
confirm_before_start: true

paths:
  masks_dir: ../artifacts/calibration/masks
  results_dir: ../artifacts/calibration/results/tucam

amplitude_slm:
  driver: holoeye
  sdk_path: "%HEDS_3_2_PYTHON_MODULES%"
  binary_folder: null
  width: 1920
  height: 1080
  pixel_pitch_um: 8
  expected_resolution_wh: [1920, 1080]
  minimum_refresh_hz: 59.0
  preload: true
  wait_until_visible: true

phase_slm:
  # 当前相位 SLM 由操作者手动加载，程序只提示所需图案。
  driver: manual
  width: 1920
  height: 1200
  pixel_pitch_um: 8
  sdk_root: ../vendor_sdk/phase_meadowlark
  lut_file: ../vendor_sdk/phase_meadowlark/LUT Files/slm3_at532.lut
  apply_wavefront_correction: false
  wavefront_correction_file: ../vendor_sdk/phase_meadowlark/WFC Files/slm7001_at532_WFC.bmp
  flip_vertical: false

amplitude_roi:
  width: 956
  height: 956
  center_x: 959.5
  center_y: 539.5

camera:
  driver: tucam
  sdk_path: ../vendor_sdk/camera_tucam_mosaic
  camera_index: 0
  timeout_ms: 10000
  config_file: null
  auto_exposure: false
  exposure_us: 5000.0
  analog_gain: null
  anti_flicker_hz: null
  resolution_mode: null

  # 必须填写为 [left, top, width, height]，四项均为 4 的倍数。
  # 厂商软件中的 ROI 不会自动共享给 Python。
  require_device_roi: true
  device_roi_xywh: null

  # 直接保存模型最终使用的逻辑 CCD：硬件 ROI -> 478×478 uint8。
  # 服务器只负责按实验配置翻转，不再保存 956×956 中间图或 float32 PT。
  saved_frame_size_wh: [478, 478]
  saved_frame_resize_mode: area
  saved_frame_bit_depth: 8
  # TUCam 当前返回 uint16；固定 0..65535 线性映射到 0..255。
  # 这是全样本一致映射，不会逐张图拉伸。若相机有效范围不同，可在此修改。
  saved_frame_input_range: [0, 65535]
  warmup_frames: 3
  discard_frames_after_display: 1

  detector_geometry:
    enabled: false
    contract_file: null
    expected_file_sha256: null

digits:
  source: synthetic
  slm_size_wh: [1920, 1080]
  active_size_wh: [956, 956]
  digit_size_px: 700
  foreground_level: 255
  background_level: 0

calibration:
  marker_size_px: 80
  marker_sigma_px: 18
  roi_outline_width_px: 4

exposure_calibration:
  exposure_times_us: [5000]
  gray_point_count: 32
  frames_per_gray: 3
  preview_gray_values: [0, 128, 255]
  patch_size_px: 160
  patch_inner_size_px: 128
  edge_taper_px: 16
  measurement_window_size_px: 128
  saturation_fraction_warning: 0.001
