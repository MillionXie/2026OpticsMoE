# 新 TUCam/Mosaic CCD 的唯一主配置。
# ROI、曝光、播放延迟只在这里修改一次，正式采集、0~9 校验和曝光检查共用。

input_dir: ../data/amplitude_to_play
output_dir: ../data/ccd_captured
log_dir: ../artifacts/logs/tucam
digit_output_dir: ../artifacts/demos/tucam_digit_sequence
output_extension: .npy
settle_delay_ms: 200
confirm_before_start: true

paths:
  masks_dir: ../artifacts/calibration/masks
  results_dir: ../artifacts/calibration/results/tucam

amplitude_slm:
  driver: holoeye
  sdk_path: "%HEDS_3_2_PYTHON_MODULES%"
  binary_folder: null
  width: 1920
  height: 1080
  pixel_pitch_um: 8
  expected_resolution_wh: [1920, 1080]
  minimum_refresh_hz: 59.0
  preload: true
  wait_until_visible: true

phase_slm:
  # 当前相位 SLM 仍由操作者手动加载；程序只打印所需 phase_zero.bmp 路径。
  driver: manual
  width: 1920
  height: 1200
  pixel_pitch_um: 8
  sdk_root: ../vendor_sdk/phase_meadowlark
  lut_file: ../vendor_sdk/phase_meadowlark/LUT Files/slm3_at532.lut
  apply_wavefront_correction: false
  wavefront_correction_file: ../vendor_sdk/phase_meadowlark/WFC Files/slm7001_at532_WFC.bmp
  flip_vertical: false

amplitude_roi:
  width: 956
  height: 956
  center_x: 959.5
  center_y: 539.5

camera:
  driver: tucam
  sdk_path: ../vendor_sdk/camera_tucam_mosaic
  camera_index: 0
  timeout_ms: 10000
  config_file: null
  auto_exposure: false
  exposure_us: 5000.0
  analog_gain: null
  anti_flicker_hz: null
  resolution_mode: null

  # 唯一需要人工填写的位置：[left, top, width, height]。
  # 厂商软件中的 ROI 不会共享给 Python。四项均须为 4 的倍数。
  # [548, 548, 956, 956] 只是居中格式示例，不是实际标定结果。
  require_device_roi: true
  device_roi_xywh: null

  # 直接保存相机硬件 ROI；不软件 resize、不扣背景、不归一化。
  saved_frame_size_wh: null
  saved_frame_resize_mode: none
  warmup_frames: 3
  discard_frames_after_display: 1

digits:
  source: synthetic
  slm_size_wh: [1920, 1080]
  active_size_wh: [956, 956]
  digit_size_px: 700
  foreground_level: 255
  background_level: 0

calibration:
  marker_size_px: 80
  marker_sigma_px: 18
  roi_outline_width_px: 4

exposure_calibration:
  # 一般在 ROI 设置后执行一次；光强、曝光、增益或光路改变后再重测。
  exposure_times_us: [5000]
  gray_start: 0
  gray_stop: 255
  gray_step: 1
  frames_per_gray: 2
  patch_size_px: 160
  patch_inner_size_px: 128
  edge_taper_px: 16
  measurement_window_size_px: 128
  saturation_fraction_warning: 0.001

