wavelength_nm: 532

paths:
  masks_dir: ../artifacts/calibration/masks
  results_dir: ../artifacts/calibration/results/dvp

amplitude_slm:
  driver: holoeye
  sdk_path: "%HEDS_3_2_PYTHON_MODULES%"
  binary_folder: null
  width: 1920
  height: 1080
  pixel_pitch_um: 8
  expected_resolution_wh: [1920, 1080]
  minimum_refresh_hz: 59.0
  preload: true
  wait_until_visible: true

# "manual" keeps the current operator-loaded phase-SLM workflow.  Set driver
# to "meadowlark" and fill the paths below to use the existing Blink controller.
phase_slm:
  driver: manual
  width: 1920
  height: 1200
  pixel_pitch_um: 8
  sdk_root: ../vendor_sdk/phase_meadowlark
  lut_file: ../vendor_sdk/phase_meadowlark/LUT Files/slm3_at532.lut
  apply_wavefront_correction: false
  wavefront_correction_file: ../vendor_sdk/phase_meadowlark/WFC Files/slm7001_at532_WFC.bmp
  flip_vertical: false

amplitude_roi:
  width: 956
  height: 956
  center_x: 959.5
  center_y: 539.5

camera:
  driver: dvp_subprocess
  sdk_path: ../vendor_sdk/camera_dvp_legacy/lib/windows/python3.6/x64
  python_executable: "%DVP_PYTHON%"
  camera_index: 0
  pixel_pitch_um: 2.4
  default_exposure_us: 5000
  timeout_ms: 4000
  config_file: null
  auto_exposure: false
  exposure_us: 5000
  analog_gain: 1.0
  anti_flicker_hz: 0
  resolution_mode: null
  # 旧 DVP 也必须手动填写最终 [left, top, width, height]。
  require_device_roi: true
  device_roi_xywh: null
  saved_frame_size_wh: null
  saved_frame_resize_mode: none
  warmup_frames: 3
  discard_frames_after_display: 1

propagation_mm: 50
relay_nominal_magnification: 1.0
settle_delay_ms: 40

calibration:
  marker_size_px: 80
  marker_sigma_px: 18
  roi_outline_width_px: 4

background:
  frames: 10

exposure_calibration:
  exposure_times_us: [5000]
  gray_start: 0
  gray_stop: 255
  gray_step: 1
  frames_per_gray: 2
  patch_size_px: 160
  patch_inner_size_px: 128
  edge_taper_px: 16
  measurement_window_size_px: 128
  low_response_fraction_of_sensor_range: 0.02
  saturation_fraction_warning: 0.001

postprocess:
  resize_enabled: false
  target_width: 956
  target_height: 956
  resize_mode: area
  save_npy: true
  save_tiff: true
  save_png_preview: false
  saturation_fraction_warning: 0.001
