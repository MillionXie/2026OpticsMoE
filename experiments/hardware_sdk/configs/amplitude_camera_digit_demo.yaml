output_dir: ../artifacts/demos/amplitude_camera_digits
settle_delay_ms: 40

digits:
  # mnist projects actual handwritten test digits; synthetic avoids downloads.
  source: mnist
  data_root: ../../../data/mnist
  download: true
  slm_size_wh: [1920, 1080]
  active_size_wh: [956, 956]
  digit_size_px: 700
  foreground_level: 255
  background_level: 0

devices:
  amplitude_slm:
    driver: holoeye
    sdk_path: ../vendor_sdk/amplitude_holoeye
    # Set HEDS_3_2_PYTHON to the installed HOLOEYE runtime root, or fill this.
    binary_folder: null
    expected_resolution_wh: [1920, 1080]
    minimum_refresh_hz: 59.0
    preload: true
    wait_until_visible: true

  camera:
    driver: dvp_subprocess
    sdk_path: ../vendor_sdk/camera_dvp_legacy/lib/linux/python3.5m/x64
    conda_env: dvp35
    camera_index: 0
    timeout_ms: 4000
    output_extension: .npy

    # Quantitative acquisition must be fixed, not controlled by auto exposure.
    config_file: null
    auto_exposure: false
    exposure_us: 10000.0
    analog_gain: 1.0
    anti_flicker_hz: 0
    resolution_mode: null
    device_roi_xywh: null
    warmup_frames: 3
    discard_frames_after_display: 1
