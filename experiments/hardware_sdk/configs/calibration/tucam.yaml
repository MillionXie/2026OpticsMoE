wavelength_nm: 532

paths:
  masks_dir: ../../artifacts/calibration/masks
  results_dir: ../../artifacts/calibration/results/tucam

amplitude_slm:
  driver: holoeye
  sdk_path: "%HEDS_3_2_PYTHON_MODULES%"
  binary_folder: null
  width: 1920
  height: 1080
  pixel_pitch_um: 8
  expected_resolution_wh: [1920, 1080]
  minimum_refresh_hz: 59.0
  preload: true
  wait_until_visible: true

phase_slm:
  driver: manual
  width: 1920
  height: 1200
  pixel_pitch_um: 8
  sdk_root: ../../vendor_sdk/phase_meadowlark
  lut_file: ../../vendor_sdk/phase_meadowlark/LUT Files/slm3_at532.lut
  apply_wavefront_correction: false
  wavefront_correction_file: ../../vendor_sdk/phase_meadowlark/WFC Files/slm7001_at532_WFC.bmp
  flip_vertical: false

amplitude_roi:
  width: 956
  height: 956
  center_x: 959.5
  center_y: 539.5

camera:
  driver: tucam
  sdk_path: ../../vendor_sdk/camera_tucam_mosaic
  camera_index: 0
  # Dhyana 400BSI V3: native 2048x2048, 6.5 um pixels, monochrome.
  pixel_pitch_um: 6.5
  native_resolution_wh: [2048, 2048]
  default_exposure_us: 5000
  timeout_ms: 10000
  config_file: null
  auto_exposure: false
  exposure_us: 5000
  analog_gain: null
  anti_flicker_hz: null
  resolution_mode: null
  # 必须手动填写 [left, top, width, height]。厂商软件中的 ROI 不会共享给本程序。
  # TUCam 的四个数均须为 4 的倍数，例如 [548, 548, 956, 956] 仅是居中示例。
  require_device_roi: true
  device_roi_xywh: null
  saved_frame_size_wh: null
  saved_frame_resize_mode: none
  warmup_frames: 3
  discard_frames_after_display: 1
  roi_constraints:
    # TUCam SDK: ROI offsets and sizes must be multiples of four pixels.
    offset_step_x: 4
    offset_step_y: 4
    width_step: 4
    height_step: 4
    min_width: 4
    min_height: 4

propagation_mm: 50
relay_nominal_magnification: 1.0
settle_delay_ms: 200

calibration:
  marker_size_px: 80
  marker_sigma_px: 18
  roi_outline_width_px: 4

background:
  frames: 10

exposure_calibration:
  exposure_times_us: [5000]
  gray_start: 0
  gray_stop: 255
  gray_step: 1
  frames_per_gray: 2
  patch_size_px: 160
  patch_inner_size_px: 128
  edge_taper_px: 16
  measurement_window_size_px: 128
  low_response_fraction_of_sensor_range: 0.02
  saturation_fraction_warning: 0.001

postprocess:
  # 手动硬件 ROI 已正确时保持 false：只扣 background，不做缩放。
  # 只有原始 ROI 大于目标尺寸时才可设 true，并使用 INTER_AREA 下采样。
  resize_enabled: false
  target_width: 956
  target_height: 956
  resize_mode: area
  save_npy: true
  save_tiff: true
  save_png_preview: false
  saturation_fraction_warning: 0.001
