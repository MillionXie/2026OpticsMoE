# 1024x1024 Meadowlark Blink PCIe amplitude SLM + TUCam/Mosaic CCD.
# Run on the laboratory Windows computer from the repository root.

input_dir: ../data/amplitude_to_play
output_dir: ../data/ccd_captured
log_dir: ../artifacts/logs/tucam_meadowlark_1024
digit_output_dir: ../artifacts/calibration/digit_sequence
output_extension: .png
settle_delay_ms: 200
confirm_before_start: true
max_files: null

# The phase SLM remains operator-controlled.  Formal acquisition refuses to
# start unless the exact 1920x1200 phase BMP is supplied here or by
# --phase-mask; its SHA256 is written into every capture row.
require_phase_mask: true
phase_mask_file: null

# Device-wide calibration assets belong to hardware_sdk, not to one Qwen
# project and never at the repository root. Task captures remain under the
# selected project's hardware_sessions/ stage directory.
paths:
  masks_dir: ../artifacts/calibration/masks
  results_dir: ../artifacts/calibration/results

amplitude_slm:
  driver: meadowlark_pcie
  sdk_path: ../vendor_sdk/amplitude_meadowlark
  board_number: 1
  expected_resolution_wh: [1024, 1024]
  width: 1024
  height: 1024
  expected_bit_depth: 8
  pixel_pitch_um: 17.0
  # Corrected command polarity used by every generated amplitude BMP below.
  # 255=white/bright/transmissive; 0=black/dark/blocking.
  timeout_ms: 5000
  wait_for_trigger: false
  flip_immediate: false
  output_pulse: false
  # Host preloading is intentionally disabled: a formal stage can contain
  # hundreds of 1 MiB frames.  Each BMP is validated before the device opens.
  preload: false
  blank_on_close: true
  # Select the LUT matching the physical SLM and operating temperature.
  # The uploaded SDK contains both slm7930_at532_30C and _70C variants.
  lut_file: ../vendor_sdk/amplitude_meadowlark/LUT Files/slm7930_at532_30C.lut

phase_slm:
  driver: manual
  width: 1920
  height: 1200
  expected_resolution_wh: [1920, 1200]
  pixel_pitch_um: 8.0

amplitude_roi:
  # 478 model pixels are placed 1:1 at the center of the 1024 SLM.
  width: 478
  height: 478
  center_x: 511.5
  center_y: 511.5

camera:
  driver: tucam
  sdk_path: ../vendor_sdk/camera_tucam_mosaic
  camera_index: 0
  timeout_ms: 10000
  config_file: null
  auto_exposure: false
  exposure_us: 5000.0
  analog_gain: null
  anti_flicker_hz: null
  resolution_mode: null

  # Required: fill [left, top, width, height] after laboratory ROI alignment.
  # Every value must be divisible by four for the Dhyana 400BSI V3 SDK.
  require_device_roi: true
  device_roi_xywh: null

  # Store the model-ready transport directly. No background subtraction,
  # per-image stretching, flip, or intermediate 956/1024 frame is saved.
  saved_frame_size_wh: [478, 478]
  # auto: area when the hardware ROI is larger than 478, bilinear when the
  # lab ROI is slightly smaller (the current machine returns 472x472).
  saved_frame_resize_mode: auto
  saved_frame_bit_depth: 8
  saved_frame_input_range: [0, 65535]
  warmup_frames: 3
  discard_frames_after_display: 1

  # Legacy axis-aligned ROI + resize remains active while this is false.  To
  # use four-corner rectification, first create a contract with
  # workflows.detector_homography, then set enabled=true and pin the exact
  # contract file SHA-256.  A canonicalized output must never be flipped again
  # by a downstream loader.
  detector_geometry:
    enabled: false
    contract_file: null
    expected_file_sha256: null

digits:
  # Offline handwritten-style 0..9 glyphs avoid a Torch/torchvision dependency
  # on the lightweight laboratory controller.
  source: synthetic
  slm_size_wh: [1024, 1024]
  active_size_wh: [478, 478]
  digit_size_px: 360
  foreground_level: 255
  background_level: 0

calibration:
  marker_size_px: 40
  marker_sigma_px: 9
  roi_outline_width_px: 3

exposure_calibration:
  exposure_times_us: [5000]
  # 32 approximately uniform values including closed=0 and open=255.
  # To use custom values, replace gray_point_count with an increasing
  # gray_values list that includes both endpoints.
  gray_point_count: 32
  frames_per_gray: 3
  preview_gray_values: [0, 128, 255]
  patch_size_px: 400
  patch_inner_size_px: 320
  edge_taper_px: 40
  measurement_window_size_px: 256
  saturation_fraction_warning: 0.001
