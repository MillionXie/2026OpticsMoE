# Full-sensor bootstrap profile for dual-SLM/Fresnel alignment.
# Use only before the formal camera ROI is known. Formal Qwen captures must use
# tucam_meadowlark_1024_windows.yaml with require_device_roi=true.

input_dir: ../data/calibration_amplitude_to_play
output_dir: ../data/calibration_ccd_captured
log_dir: ../artifacts/logs/tucam_meadowlark_calibration
output_extension: .png
settle_delay_ms: 200
confirm_before_start: true
max_files: null

require_phase_mask: true
phase_mask_file: null

amplitude_slm:
  driver: meadowlark_pcie
  sdk_path: ../vendor_sdk/amplitude_meadowlark
  board_number: 1
  expected_resolution_wh: [1024, 1024]
  width: 1024
  height: 1024
  expected_bit_depth: 8
  pixel_pitch_um: 17.0
  timeout_ms: 5000
  wait_for_trigger: false
  flip_immediate: false
  output_pulse: false
  preload: false
  blank_on_close: true
  lut_file: ../vendor_sdk/amplitude_meadowlark/LUT Files/slm7930_at532_30C.lut

phase_slm:
  driver: manual
  width: 1920
  height: 1200
  expected_resolution_wh: [1920, 1200]
  pixel_pitch_um: 8.0

camera:
  driver: tucam
  sdk_path: ../vendor_sdk/camera_tucam_mosaic
  camera_index: 0
  timeout_ms: 10000
  config_file: null
  auto_exposure: false
  exposure_us: 5000.0
  analog_gain: null
  anti_flicker_hz: null
  resolution_mode: null

  # Deliberately no device ROI: the n4 pattern is what establishes its bounds.
  require_device_roi: false
  device_roi_xywh: null

  # Preserve full native geometry during bootstrap calibration. Only a few
  # frames are saved; there is no resize, crop, background subtraction or flip.
  saved_frame_size_wh: null
  saved_frame_resize_mode: none
  saved_frame_bit_depth: 8
  saved_frame_input_range: [0, 65535]
  warmup_frames: 3
  discard_frames_after_display: 1
