base_config: spatial_readout_moments_s640.yaml
output_dir: ../../runs/lgvq_spatial_conv5_distilled_s721
random_seed: 721

# Experimental lightweight replacement: the target-trained 339k Conv5 absorbs the
# rejected teacher's E1 correction.  No ResNet/VGG/attention/Transformer is
# present in the student inference graph. Promote it to formal only after the
# end-to-end SRCC measurement is recorded.
data:
  quality_feature_cache: null
  raw_frame_cache: ../../artifacts/lgvq_four_frames_center100_224_uint8.pt
  resnet_feature_cache: null
  training_view_probabilities: [1.0, 0.0, 0.0]

initialization:
  frame_stem_checkpoint: ../../artifacts/lgvq_conv5_source_checkpoint.pt

model:
  quality_input_width: 192
  quality_branch_enabled: false
  electronic_quality_residual_enabled: true
  trainable_frame_stem_enabled: true
  tiny_rgb_electronic_adapter_enabled: false

training:
  initialization_checkpoint: ../../artifacts/distillation/s721/distilled_student_initialization.pt
  trainable_scope: frame_stem_only
  epochs: 60
  batch_size: 16
  learning_rate: 0.00001
  weight_decay: 0.001
  ema_decay: 0.997
  test_interval_epochs: 1
  test_interval_steps: 0
  phase_snapshot_interval_epochs: 0

loss:
  regression_weight: 0.20
  ranking_weight: 2.00
  correlation_weight: 4.00
  soft_spearman_weight: 0.40
  soft_target_weight: 0.0
  level_distribution_weight: 0.0
  optical_alignment_weight: 0.0
  router_balance_weight: 0.0
  router_importance_weight: 0.0
  serial_router_balance_weight: 0.0
  serial_router_importance_weight: 0.0
