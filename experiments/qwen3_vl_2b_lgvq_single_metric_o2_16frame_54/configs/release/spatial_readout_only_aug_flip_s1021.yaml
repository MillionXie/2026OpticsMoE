base_config: spatial_custom_conv_aligned_multiview_s967.yaml
output_dir: ../../runs/lgvq_spatial_readout_only_aug_flip_s1021
random_seed: 1021

# Freeze the already mature optical and custom-convolution features and adapt
# only the existing compact readout under synchronized horizontal reflection.
training:
  initialization_checkpoint: ../../../../LightGenV2/tasks/t06_video_quality_assessment/runs/simulation/spatial_paired_views_s991/best_paired_view_deploy.pt
  trainable_scope: readout_only
  epochs: 20
  learning_rate: 0.000005
  readout_learning_rate_factor: 0.20
  ema_decay: 0.997
  test_interval_steps: 12
  horizontal_flip_probability: 0.50

loss:
  paired_view_supervision_weight: 0.10
  paired_view_consistency_weight: 0.02
