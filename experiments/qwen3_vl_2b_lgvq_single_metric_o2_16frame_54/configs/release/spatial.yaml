output_dir: ../../runs/lgvq_spatial_qwenfront_o2_4f109_dc20
device: cuda
random_seed: 42

task:
  target_name: spatial
  prompt: "Please evaluate the spatial quality of this video and rate it using one of the following five levels: Excellent, Good, Fair, Poor, or Bad."

data:
  dataset_root: /DATA/DATA1/lixinyue/xyli/data/LGVQ
  manifest: ../../../lgvq_four_stage_optical_electronic_109_no_attention_vqa/artifacts/lgvq_train2250_test558.csv
  # Spatial deliberately retains the earlier four-frame optical layout.
  vision_cache: ../../artifacts/qwen3vl_front_4f_49x1024_quality14.pt
  language_cache: ../../artifacts/qwen3vl_front_spatial_prompt_2048.pt
  # Existing two-column file is joined by sample_id; only its Spatial column is used.
  training_soft_targets: ../../../lgvq_four_stage_optical_electronic_109_no_attention_vqa/artifacts/training_only_teacher_predictions.pt

initialization:
  qwen_model_path: null

geometry:
  canvas_size: 518
  active_size: 478
  lane_grid: 2
  lane_size: 232
  lane_pitch: 246
  lane_offset: 0
  parallel_expert_size: 109
  parallel_expert_pitch: 123
  serial_expert_size: 109
  serial_expert_pitch: 123

model:
  frame_count: 4
  token_grid: 7
  vision_input_width: 1024
  quality_input_width: 14
  language_input_width: 2048
  # Total sequence limit: four frame summaries plus the target-specific prompt.
  maximum_language_tokens: 96
  model_width: 192
  detector_projection_size: 96
  head_width: 384
  dropout: 0.12

router:
  top_k: 2
  temperature: 1.0
  noise_std: 0.03
  parallel_intervals: [[79, 108], [124, 153]]
  serial_intervals: [[164, 223], [255, 314]]

optics:
  wavelength_nm: 532.0
  pixel_pitch_um: 17.0
  distance_m: 0.10
  k_space_enabled: true
  theta_max_deg: 1.0
  phase_init_std: 0.25
  ccd_relative_clip: 8.0
  ccd_log_compression: 1.0
  unmodulated_power_fraction_min: 0.20
  unmodulated_power_fraction_max: 0.35
  unmodulated_power_fraction_eval: 0.20

robustness:
  input_shift_pixels: 4
  phase_shift_pixels: 4
  ccd_shift_pixels: 4
  phase_dropout_p: 0.05
  phase_dropout_cell_size: 4

fusion:
  alpha_min: 0.50
  alpha_initial: 0.57
  alpha_max: 0.90
  epsilon: 0.000001

training:
  epochs: 120
  batch_size: 64
  num_workers: 4
  learning_rate: 0.00025
  phase_learning_rate: 0.010
  router_phase_learning_rate: 0.015
  weight_decay: 0.0001
  # No validation split: observe the fixed test set periodically as requested.
  test_interval_epochs: 5
  phase_snapshot_interval_epochs: 5

loss:
  ranking_weight: 0.25
  correlation_weight: 1.00
  optical_alignment_weight: 0.05
  router_balance_weight: 0.02
  router_importance_weight: 0.002
  router_capture_weight: 0.02
  soft_target_weight: 3.00
