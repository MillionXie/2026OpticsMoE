base_config: spatial_trainonly_fixed20_globalrank_s453.yaml
output_dir: ../../runs/lgvq_spatial_trainonly_fixed20_step_global_s457
random_seed: 457

# Large MOS-spanning batches plus sub-epoch checkpoint selection.  The very
# small step protects the mature electronic and optical representations.
data:
  training_view_probabilities: [1.0, 0.0, 0.0]

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_trainonly_fixed20_rankstrong_s447/best_observed_test_checkpoint.pt
  epochs: 2
  batch_size: 256
  learning_rate: 0.0000005
  phase_learning_rate: 0.00001
  router_phase_learning_rate: 0.00002
  readout_learning_rate_factor: 0.35
  minimum_learning_rate_factor: 0.50
  ema_decay: 0.90
  test_interval_epochs: 1
  test_interval_steps: 2
  phase_snapshot_interval_epochs: 2

