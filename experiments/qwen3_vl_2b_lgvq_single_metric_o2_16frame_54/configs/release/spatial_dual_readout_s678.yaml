base_config: spatial_readout_moments_s640.yaml
output_dir: ../../runs/lgvq_spatial_dual_readout_s678
random_seed: 678

# One post-optical head: the trained five-level correction is retained and a
# zero-start scalar correction learns only genuinely complementary residuals.
model:
  spatial_readout_mode: spatial_dual_level_residual

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_moments_calibrated_s643/best_alpha_calibrated_checkpoint.pt
  trainable_scope: dual_refiner_only
  epochs: 100
  batch_size: 64
  learning_rate: 0.00010
  weight_decay: 0.001
  minimum_learning_rate_factor: 0.02
  ema_decay: 0.99
  ema_start_epoch: 1
  test_interval_epochs: 1
  test_interval_steps: 0
  phase_snapshot_interval_epochs: 0

loss:
  regression_weight: 0.50
  ranking_weight: 1.00
  correlation_weight: 2.00
  soft_spearman_weight: 0.20
  soft_rank_temperature: 0.12
  soft_target_weight: 0.0
  level_distribution_weight: 0.0
  optical_alignment_weight: 0.0
  router_balance_weight: 0.0
  router_importance_weight: 0.0
  serial_router_balance_weight: 0.0
  serial_router_importance_weight: 0.0
  router_capture_weight: 0.0
