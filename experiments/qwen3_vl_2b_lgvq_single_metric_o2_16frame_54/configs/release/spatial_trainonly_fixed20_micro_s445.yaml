base_config: spatial_continuous_s414_refine_s437.yaml
output_dir: ../../runs/lgvq_spatial_trainonly_fixed20_micro_s445
random_seed: 445

# Training-only refinement. The inference graph is byte-for-byte identical to
# s437: continuous phase, no k-space mask, no pixel perturbation, Top-2 optical
# routing, and the same E/O/readout modules.
optics:
  unmodulated_power_fraction_min: 0.20
  unmodulated_power_fraction_max: 0.20
  unmodulated_power_fraction_eval: 0.20

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_continuous_s414_refine_s437/best_observed_test_checkpoint.pt
  epochs: 100
  batch_size: 64
  learning_rate: 0.000003
  phase_learning_rate: 0.00008
  router_phase_learning_rate: 0.00016
  readout_learning_rate_factor: 0.35
  learning_rate_warmup_epochs: 0
  minimum_learning_rate_factor: 0.03
  phase_warmup_epochs: 0
  late_refine_start_epoch: 0
  restore_best_at_stage_transition: false
  ema_decay: 0.90
  ema_start_epoch: 1
  test_interval_epochs: 1
  phase_snapshot_interval_epochs: 100

loss:
  soft_target_weight: 0.0

curriculum:
  enabled: false
  unmodulated_power_fraction_max_initial: 0.20
