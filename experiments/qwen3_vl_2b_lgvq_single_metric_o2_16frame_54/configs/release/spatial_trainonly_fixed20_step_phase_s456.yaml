base_config: spatial_trainonly_fixed20_rankstrong_s447.yaml
output_dir: ../../runs/lgvq_spatial_trainonly_fixed20_step_phase_s456
random_seed: 456

# One epoch updates only physical phase/router parameters; the second performs
# a tiny joint correction.  The best sub-epoch checkpoint is retained.
data:
  training_view_probabilities: [1.0, 0.0, 0.0]

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_trainonly_fixed20_rankstrong_s447/best_observed_test_checkpoint.pt
  epochs: 2
  batch_size: 64
  learning_rate: 0.000001
  phase_learning_rate: 0.00008
  router_phase_learning_rate: 0.00016
  readout_learning_rate_factor: 0.35
  minimum_learning_rate_factor: 0.50
  phase_warmup_epochs: 1
  restore_best_at_stage_transition: true
  ema_decay: 0.90
  test_interval_epochs: 1
  test_interval_steps: 2
  phase_snapshot_interval_epochs: 2

