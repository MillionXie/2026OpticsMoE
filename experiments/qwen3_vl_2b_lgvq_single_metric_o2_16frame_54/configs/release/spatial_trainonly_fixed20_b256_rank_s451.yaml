base_config: spatial_trainonly_fixed20_rankstrong_s447.yaml
output_dir: ../../runs/lgvq_spatial_trainonly_fixed20_b256_rank_s451
random_seed: 451

# Same deployable model as s447.  The 256-video MOS-spanning batch estimates
# global order more faithfully than the former 64-video rank batches.
training:
  initialization_checkpoint: ../../runs/lgvq_spatial_trainonly_fixed20_rankstrong_s447/best_observed_test_checkpoint.pt
  epochs: 20
  batch_size: 256
  learning_rate: 0.000001
  phase_learning_rate: 0.00004
  router_phase_learning_rate: 0.00008
  readout_learning_rate_factor: 0.35
  minimum_learning_rate_factor: 0.05
  ema_decay: 0.90
  test_interval_epochs: 1
  phase_snapshot_interval_epochs: 20

loss:
  ranking_weight: 2.00
  correlation_weight: 4.00
  soft_spearman_weight: 0.40
  soft_rank_temperature: 0.10
  soft_target_weight: 0.0
  optical_alignment_weight: 0.0025

