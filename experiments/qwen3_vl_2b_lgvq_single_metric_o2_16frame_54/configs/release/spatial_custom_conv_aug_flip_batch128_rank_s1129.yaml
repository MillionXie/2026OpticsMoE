base_config: spatial_custom_conv_aug_flip_s1019.yaml
output_dir: ../../runs/lgvq_spatial_custom_conv_aug_flip_batch128_rank_s1129
random_seed: 1129

# Batch-128 counterpart with a conservative SRCC-oriented late curriculum.
# It changes only the optimizer trajectory, never the inference graph.
training:
  initialization_checkpoint: ../../../../LightGenV2/tasks/t06_video_quality_assessment/runs/simulation/spatial_paired_views_s991/best_paired_view_deploy.pt
  epochs: 45
  batch_size: 128
  learning_rate: 0.00000125
  readout_learning_rate_factor: 0.20
  ema_decay: 0.99
  test_interval_steps: 9
  horizontal_flip_probability: 0.50

curriculum:
  enabled: true
  start_epoch: 10
  end_epoch: 36
  ranking_weight_final: 2.50
  correlation_weight_final: 3.50
  soft_spearman_weight_final: 0.60
