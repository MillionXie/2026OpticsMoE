base_config: spatial_mobilenetv2_b10_rank_s741.yaml
output_dir: ../../runs/lgvq_spatial_mobilenetv2_readout_s743
random_seed: 743

# Conservative stage two: co-adapt only the compact E1 adapter and the single
# existing MOS readout. Optical masks, routers and all four O/E routes stay fixed.
training:
  initialization_checkpoint: ../../runs/lgvq_spatial_mobilenetv2_b10_rank_s741/best_observed_test_checkpoint.pt
  trainable_scope: mobilenet_electronic_and_readout
  epochs: 60
  batch_size: 32
  learning_rate: 0.00002
  weight_decay: 0.001
  learning_rate_warmup_epochs: 2
  ema_decay: 0.999
  ema_start_epoch: 1
