base_config: spatial_two_branch_equality_d2_s320.yaml
output_dir: ../../runs/lgvq_spatial_two_branch_equality_d2_s323
random_seed: 323

# The historical no-VGG optimum used the frozen Conv5 representation at about
# 0.95 strength.  It is still contained inside the sole E route here; the O
# route receives only the Qwen visual representation.
model:
  electronic_quality_residual_initial: 0.95

training:
  learning_rate: 0.00010
  phase_learning_rate: 0.003
  router_phase_learning_rate: 0.008
  test_interval_epochs: 1

loss:
  router_balance_weight: 0.03
  router_importance_weight: 0.008
  serial_router_balance_weight: 0.12
  serial_router_importance_weight: 0.06
