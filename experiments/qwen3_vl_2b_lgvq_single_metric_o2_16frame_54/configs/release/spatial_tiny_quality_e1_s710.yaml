base_config: spatial_readout_moments_s640.yaml
output_dir: ../../runs/lgvq_spatial_tiny_quality_e1_s710
random_seed: 710

# Compliant replacement for the rejected pretrained ResNet18 front.  The
# existing small target-trained Conv5 cache is kept, but this new E1 adapter is
# randomly initialized, depthwise-separable, and has no independent MOS head.
data:
  resnet_feature_cache: null
  training_view_probabilities: [1.0, 0.0, 0.0]

model:
  tiny_quality_electronic_adapter_enabled: true
  tiny_quality_electronic_adapter_max: 0.50

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_moments_calibrated_s643/best_alpha_calibrated_checkpoint.pt
  trainable_scope: tiny_quality_adapter_only
  epochs: 100
  batch_size: 64
  learning_rate: 0.00030
  weight_decay: 0.001
  learning_rate_warmup_epochs: 3
  minimum_learning_rate_factor: 0.02
  ema_decay: 0.99
  ema_start_epoch: 1
  test_interval_epochs: 1
  test_interval_steps: 0
  phase_snapshot_interval_epochs: 0

loss:
  regression_weight: 0.20
  ranking_weight: 2.00
  correlation_weight: 4.00
  soft_spearman_weight: 0.40
  soft_rank_temperature: 0.12
  soft_target_weight: 0.0
  level_distribution_weight: 0.0
  optical_alignment_weight: 0.0
  router_balance_weight: 0.0
  router_importance_weight: 0.0
  serial_router_balance_weight: 0.0
  serial_router_importance_weight: 0.0
  router_capture_weight: 0.0
