base_config: spatial_two_branch_equality_refine_s324.yaml
output_dir: ../../runs/lgvq_spatial_two_branch_rank_refine_s325
random_seed: 325

# Same strict two-branch graph.  Reduce teacher imitation during continuation
# and put more weight on the ranking objective used by SRCC selection.
loss:
  soft_target_weight: 1.0
  ranking_weight: 0.30
  correlation_weight: 0.50

training:
  learning_rate: 0.00004
  phase_learning_rate: 0.001
  router_phase_learning_rate: 0.003
