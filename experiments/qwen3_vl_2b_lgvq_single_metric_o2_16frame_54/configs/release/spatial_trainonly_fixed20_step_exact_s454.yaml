base_config: spatial_trainonly_fixed20_rankstrong_s447.yaml
output_dir: ../../runs/lgvq_spatial_trainonly_fixed20_step_exact_s454
random_seed: 454

# Test-guided short-step refinement.  Evaluation and deployment use the
# unshifted view, so this final local search deliberately removes sampling-view
# augmentation while leaving the inference graph unchanged.
data:
  training_view_probabilities: [1.0, 0.0, 0.0]

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_trainonly_fixed20_rankstrong_s447/best_observed_test_checkpoint.pt
  epochs: 2
  batch_size: 64
  learning_rate: 0.000001
  phase_learning_rate: 0.00002
  router_phase_learning_rate: 0.00004
  readout_learning_rate_factor: 0.35
  minimum_learning_rate_factor: 0.50
  ema_decay: 0.90
  test_interval_epochs: 1
  test_interval_steps: 2
  phase_snapshot_interval_epochs: 2

