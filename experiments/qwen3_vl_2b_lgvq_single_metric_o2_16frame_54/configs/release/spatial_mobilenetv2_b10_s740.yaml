base_config: spatial_readout_moments_s640.yaml
output_dir: ../../runs/lgvq_spatial_mobilenetv2_b10_s740
random_seed: 740

# Formal-size pretrained lightweight candidate. MobileNetV2 features[0:11]
# contributes 239,360 frozen convolution parameters; its E1-only adapter has
# 49,536 trainable parameters. Total added electronic front: 288,896.
data:
  mobilenet_feature_cache: ../../artifacts/lgvq_mobilenetv2_b10_4f_196x64.pt
  resnet_feature_cache: null
  training_view_probabilities: [1.0, 0.0, 0.0]

model:
  mobilenet_electronic_max: 1.40

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_moments_calibrated_s643/best_alpha_calibrated_checkpoint.pt
  trainable_scope: mobilenet_electronic_only
  epochs: 100
  batch_size: 64
  learning_rate: 0.00010
  weight_decay: 0.001
  learning_rate_warmup_epochs: 3
  minimum_learning_rate_factor: 0.02
  ema_decay: 0.99
  ema_start_epoch: 1
  test_interval_epochs: 1
  test_interval_steps: 0
  phase_snapshot_interval_epochs: 0

loss:
  regression_weight: 0.50
  ranking_weight: 1.00
  correlation_weight: 2.00
  soft_spearman_weight: 0.20
  soft_rank_temperature: 0.12
  soft_target_weight: 0.0
  soft_target_ranking_weight: 0.0
  soft_target_correlation_weight: 0.0
  level_distribution_weight: 0.0
  optical_alignment_weight: 0.0
  router_balance_weight: 0.0
  router_importance_weight: 0.0
  serial_router_balance_weight: 0.0
  serial_router_importance_weight: 0.0
  router_capture_weight: 0.0
