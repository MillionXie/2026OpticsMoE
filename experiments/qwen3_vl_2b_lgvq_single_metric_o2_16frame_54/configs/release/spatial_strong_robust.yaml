base_config: spatial.yaml

# Internal robustness candidate. It keeps the exact same inference graph,
# target, prompt, 4x4/54 geometry, Top-2 router and alpha floor; only training
# perturbations are stronger. Select it only by the same 558-video Spatial
# test protocol, not by a different metric.
output_dir: ../../runs/lgvq_spatial_qwenfront_o2_16f54_strong_robust

robustness:
  input_shift_pixels: 8
  phase_shift_pixels: 8
  ccd_shift_pixels: 8
  phase_dropout_p: 0.05
  phase_dropout_cell_size: 4

router:
  noise_std: 0.05
