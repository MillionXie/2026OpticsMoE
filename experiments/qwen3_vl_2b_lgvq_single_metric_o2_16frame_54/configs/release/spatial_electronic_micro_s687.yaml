base_config: spatial_readout_moments_s640.yaml
output_dir: ../../runs/lgvq_spatial_electronic_micro_s687
random_seed: 687

# Conservative fine-tuning of the existing electronic residual route only.
# Optical phases, optical routers, fusion alphas and MOS readout stay frozen.
data:
  training_view_probabilities: [1.0, 0.0, 0.0]

training:
  initialization_checkpoint: ../../runs/lgvq_spatial_moments_calibrated_s643/best_alpha_calibrated_checkpoint.pt
  trainable_scope: electronic_path_only
  epochs: 100
  batch_size: 64
  learning_rate: 0.000001
  weight_decay: 0.0001
  learning_rate_warmup_epochs: 0
  minimum_learning_rate_factor: 0.05
  ema_decay: 0.995
  ema_start_epoch: 1
  test_interval_epochs: 1
  test_interval_steps: 0
  phase_snapshot_interval_epochs: 0

loss:
  regression_weight: 1.00
  ranking_weight: 0.50
  correlation_weight: 1.00
  soft_spearman_weight: 0.10
  soft_rank_temperature: 0.15
  soft_target_weight: 0.0
  level_distribution_weight: 0.0
  optical_alignment_weight: 0.0
  router_balance_weight: 0.0
  router_importance_weight: 0.0
  serial_router_balance_weight: 0.0
  serial_router_importance_weight: 0.0
  router_capture_weight: 0.0
