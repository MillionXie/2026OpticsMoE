base_config: spatial_calibrated_s620.yaml
output_dir: ../../runs/lgvq_spatial_multiview_joint_s632
random_seed: 632

data:
  training_view_probabilities: [0.80, 0.10, 0.10]

# Very small joint continuation: augmentation regularizes the physical masks,
# while the already good five-level head and fusion coefficients move slowly.
training:
  initialization_checkpoint: ../../runs/lgvq_spatial_router_temperature_s620/best_alpha_calibrated_checkpoint.pt
  trainable_scope: all
  epochs: 30
  batch_size: 64
  learning_rate: 0.000001
  phase_learning_rate: 0.000030
  router_phase_learning_rate: 0.000060
  readout_learning_rate_factor: 0.25
  readout_weight_decay: 0.004
  phase_warmup_epochs: 0
  late_refine_start_epoch: 0
  restore_best_at_stage_transition: false
  ema_decay: 0.95
  ema_start_epoch: 1
  minimum_learning_rate_factor: 0.10
  test_interval_epochs: 1
  test_interval_steps: 4
  phase_snapshot_interval_epochs: 0

loss:
  ranking_weight: 1.00
  correlation_weight: 2.00
  soft_spearman_weight: 0.20
  soft_rank_temperature: 0.10
  soft_target_weight: 0.0
  soft_target_ranking_weight: 0.0
  soft_target_correlation_weight: 0.0
  level_distribution_weight: 0.20
  optical_alignment_weight: 0.001
  router_balance_weight: 0.002
  router_importance_weight: 0.0005
  serial_router_balance_weight: 0.002
  serial_router_importance_weight: 0.0005
  router_capture_weight: 0.0
