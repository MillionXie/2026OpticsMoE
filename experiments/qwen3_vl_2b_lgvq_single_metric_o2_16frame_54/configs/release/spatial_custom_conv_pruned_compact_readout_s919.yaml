# Keeps the trained Spatial-grid branch, structurally prunes its largest hidden
# layer from 1024 to 384 neurons, and adds a zero-start compact correction.
# All optical stages and the custom Conv E1 front remain unchanged.
model:
  spatial_readout_mode: spatial_pruned_grid_compact_residual
  spatial_compact_head_width: 384
  spatial_residual_max: 2.0262

loss:
  level_distribution_weight: 0.0
