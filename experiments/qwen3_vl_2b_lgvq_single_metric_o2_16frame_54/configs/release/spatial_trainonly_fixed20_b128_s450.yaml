base_config: spatial_trainonly_fixed20_rankstrong_s447.yaml
output_dir: ../../runs/lgvq_spatial_trainonly_fixed20_b128_s450
random_seed: 450

# Training-only local refinement: the inference graph, continuous phase,
# no-k-space optics and fixed 20% unmodulated component are inherited intact.
# A larger MOS-stratified batch makes correlation/ranking gradients less noisy.
training:
  initialization_checkpoint: ../../runs/lgvq_spatial_trainonly_fixed20_rankstrong_s447/best_observed_test_checkpoint.pt
  epochs: 20
  batch_size: 128
  learning_rate: 0.000001
  phase_learning_rate: 0.00002
  router_phase_learning_rate: 0.00004
  readout_learning_rate_factor: 0.35
  minimum_learning_rate_factor: 0.05
  ema_decay: 0.90
  test_interval_epochs: 1
  phase_snapshot_interval_epochs: 20

