base_config: spatial_custom_conv_aligned_multiview_s967.yaml
output_dir: ../../runs/lgvq_spatial_custom_conv_aug_flip_s1019
random_seed: 1019

# Spatial MOS is invariant to a left-right reflection. Qwen tokens, Conv5
# tokens and raw frames are flipped as one tuple during training only.
training:
  initialization_checkpoint: ../../../../LightGenV2/tasks/t06_video_quality_assessment/runs/simulation/spatial_paired_views_s991/best_paired_view_deploy.pt
  epochs: 30
  learning_rate: 0.000001
  readout_learning_rate_factor: 0.20
  ema_decay: 0.997
  test_interval_steps: 12
  horizontal_flip_probability: 0.50

loss:
  paired_view_supervision_weight: 0.12
  paired_view_consistency_weight: 0.02
