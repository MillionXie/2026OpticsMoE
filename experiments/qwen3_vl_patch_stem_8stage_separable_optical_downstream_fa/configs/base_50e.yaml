# P12 shared downstream fixed-feedback recipe. Method launchers may override
# only selection.*, output_dir and smoke limits; the scientific recipe is
# intentionally common to all four feedback groups.
selection:
  task: caltech101
  method: bp
  seed: 2026

paths:
  source_backbone: experiments/qwen3_vl_patch_stem_8stage_separable_optical_imagenet_backbone/runs/p11_imagenet1k_pretrain_bs96_90e/checkpoints/backbone.pt
  source_backbone_sha256: c3ad0b780dfbb3e5f8e1f7b7850c06fcb5c6d977e106f351b4602fcaadf210d2
  stem_checkpoint: experiments/qwen3_vl_patch_stem_8stage_optical_imagenet_backbone/assets/qwen3_vl_static_stem_224.pt
  output_root: experiments/qwen3_vl_patch_stem_8stage_separable_optical_downstream_fa/runs/p12_downstream_fa_50e
  data_roots:
    caltech101: data/Caltech101
    isic2016: data/ISIC2016
    lsp: data/lsp_pose

# These values are a load-time architecture lock, not a tunable model search.
model:
  canvas_size: 224
  optical_channels: 3
  num_stages: 8
  token_dim: 224
  token_count: 196
  mixer_width: 96
  axis_schedule: [token, channel, token, channel, token, channel, token, channel]
  architecture_signature: [11, 1, 2, 4]
  optical_gate_min: 0.50
  minimum_optical_parameter_fraction: 0.50
  expected_optical_parameters: 1204224

optimizer:
  # 3e-3 is the preregistered primary phase LR. A shared BP pilot may select
  # 7e-3 once, but an FA method must never receive method-specific tuning.
  phase_learning_rate: 3.0e-3
  adapter_learning_rate: 2.0e-4
  residual_learning_rate: 2.0e-4
  head_learning_rate: 1.0e-3
  phase_weight_decay: 0.0
  electronic_weight_decay: 5.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  warmup_epochs: 1
  minimum_learning_rate_ratio: 0.05
  phase_gradient_clip_norm: 2.0
  electronic_gradient_clip_norm: 5.0

training:
  # NoFT/common_start is the 50-epoch head-only endpoint. Updating methods
  # inherit it and then receive the same 50-epoch adaptation budget.
  head_only_epochs: 50
  adaptation_epochs: 50
  use_amp: true
  amp_initial_scale: 256
  amp_growth_interval: 100000
  deterministic_feedback: true
  restore_rng_on_resume: true

dataloader:
  # Workers are recreated each epoch so the saved DataLoader generator state
  # is sufficient to reproduce augmentation streams after a process restart.
  persistent_workers: false
  pin_memory: true
  prefetch_factor: 2

save:
  evaluation_interval_epochs: 1
  checkpoint_interval_epochs: 5
  log_interval_batches: 25
  diagnostic_epochs: [0, 1, 5, 10, 20, 30, 40, 50]
  save_last_every_epoch: true
  run_final_ablations: true

# Null means the full split. Launchers override these only for smoke tests.
limits:
  max_train_samples: null
  max_validation_samples: null
  max_test_samples: null
  max_train_batches: null
  max_validation_batches: null
  max_test_batches: null

tasks:
  caltech101:
    kind: classification
    primary_metric: top1
    num_outputs: 101
    train_batch_size: 96
    evaluation_batch_size: 192
    num_workers: 8
    validation_fraction: 0.15
    head_hidden_dim: 256
    decoder_width: null
    output_size: null
    expected_train_samples: 2525
    expected_test_samples: 5647

  isic2016:
    kind: segmentation
    primary_metric: mean_iou
    num_outputs: 1
    # Locked conservatively for both 24-GiB 3090 and 4090. A smoke may lower
    # this for every ISIC method, never for one feedback method alone.
    train_batch_size: 32
    evaluation_batch_size: 64
    num_workers: 8
    validation_fraction: 0.20
    head_hidden_dim: null
    decoder_width: 64
    output_size: 224
    expected_train_samples: 720
    expected_test_samples: 379

  lsp:
    kind: pose
    primary_metric: pck_torso_0p2
    num_outputs: 14
    train_batch_size: 32
    evaluation_batch_size: 64
    num_workers: 8
    validation_fraction: 0.10
    head_hidden_dim: null
    decoder_width: 64
    # The validated LSP pipeline supervises 14 heatmaps at 56x56.
    output_size: 56
    # After the source-stratified 10% validation split.
    expected_train_samples: 9385
    expected_test_samples: 1000
