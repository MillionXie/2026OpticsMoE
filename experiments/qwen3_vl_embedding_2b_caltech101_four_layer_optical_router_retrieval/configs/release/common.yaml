base_config: ../../../qwen3_vl_embedding_2b_caltech101_four_layer_optical_retrieval_10cm_warmstart5/configs/release/stage2_joint_sealed_test.yaml

# Every adaptation variant starts from this exact EMA Stage-B body.  The
# sealed test did not select it; minimum training total loss did.
router_experiment:
  source_checkpoint: ../../../qwen3_vl_embedding_2b_caltech101_four_layer_optical_retrieval_10cm_warmstart5/runs/caltech101_warmstart5_stage2_joint_sealed_test/ema_best_train_loss_checkpoint.pt
  source_sha256: 6a27f54d8c869cce46150583383a127b0ba47b3d34503f5753aa23974ac1e55d
  protocol: equal_budget_adaptation
  reset_router_parameters: true
  weight_normalization: power_l2
  straight_through: true
  optical:
    # 59x59 windows remain inside the unchanged 478 CCD ROI.  Their centres
    # are +/-45.5 px per axis, requiring 0.627 deg at 17 um / 10 cm and thus
    # staying inside the formal 0.65-deg radial k-space cutoff.
    detector_intervals: [[164, 223], [255, 314]]
    score_normalization: standardized_region_energy
    energy_eps: 1.0e-8
    capture_loss_scale: 0.10
    phase_dropout_p: 0.05
    phase_dropout_block_size: 8
    input_shift_pixels: 16
    phase_shift_pixels: 16
    ccd_shift_pixels: 16

training:
  epochs: 12
  # Raw phase logits must not drift toward zero (physical pi) merely because
  # AdamW decay is multiplied by the much larger Router-phase LR.  All four
  # matched variants therefore disable weight decay explicitly.
  weight_decay: 0.0
  learning_rate: 0.00002
  adapter_learning_rate: 0.000005
  readout_learning_rate: 0.00001
  phase_learning_rate: 0.006
  router_learning_rate: 0.0002
  lambda_router_balance: 0.05
  lambda_router_importance: 0.005
  evaluate_test_each_epoch: false
  resume_optimizer_state: false
  # All variants receive exactly the same router-update opportunities.
  phase_focus: {enabled: false, warmup_epochs: 0, interval_epochs: 1}

batching:
  batch_size: 30
  pk_skus_per_batch: 10
  pk_images_per_sku: 3
  optimizer_steps_per_epoch: 12
