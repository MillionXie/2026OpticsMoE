base_config: resnet18_imagenet.yaml

dataset:
  train_limit_per_sku: 2
  test_limit_per_sku: 1

model:
  weights: none

batching:
  batch_size: 20
  pk_skus_per_batch: 10
  pk_images_per_sku: 2
  inference_batch_size: 10
  num_workers: 0

training:
  epochs: 1
  evaluate_test_each_epoch: true
  log_interval_batches: 1

output_dir: ../runs/resnet18_smoke
