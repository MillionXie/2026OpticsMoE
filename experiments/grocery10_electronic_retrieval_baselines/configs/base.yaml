dataset:
  dataset_root: ../../../data/GroceryStoreDataset
  download: true
  download_url: https://github.com/marcusklasson/GroceryStoreDataset/archive/refs/heads/master.zip
  selected_skus:
    - God-Morgon-Orange-Juice
    - Tropicana-Golden-Grapefruit
    - Arla-Ecological-Medium-Fat-Milk
    - Oatly-Natural-Oatghurt
    - Oatly-Oat-Milk
    - Alpro-Blueberry-Soyghurt
    - Alpro-Shelf-Soy-Milk
    - Yoggi-Strawberry-Yoghurt
    - God-Morgon-Apple-Juice
    - Tropicana-Mandarin-Morning
  merge_official_validation_into_train: true
  train_limit_per_sku: null
  test_limit_per_sku: null
  gallery_images_per_sku: 1

model:
  name: resnet18
  weights: imagenet1k
  image_size: 224
  embedding_dim: 64
  train_backbone: true

retrieval:
  gallery_aggregation: mean_prototype

batching:
  batch_size: 30
  pk_skus_per_batch: 10
  pk_images_per_sku: 3
  inference_batch_size: 64
  num_workers: 4

training:
  epochs: 100
  backbone_learning_rate: 0.00001
  projection_learning_rate: 0.0003
  weight_decay: 0.0001
  lambda_ret: 1.0
  lambda_gallery: 0.25
  temperature: 0.07
  gallery_temperature: 0.15
  gallery_prototype_stop_gradient: true
  scheduler: cosine
  min_learning_rate: 0.000001
  random_seed: 42
  amp_enabled: true
  evaluate_test_each_epoch: true
  log_interval_batches: 5

augmentation:
  enabled: true
  crop_scale_min: 0.90
  brightness_jitter: 0.10
  contrast_jitter: 0.10
  rotation_degrees: 5.0

visualization:
  sample_count: 8

comparison:
  optical_metrics_path: ../../qwen3_vl_embedding_2b_grocery10_optical_retrieval/runs/qwen3_vl_embedding_2b_grocery10_replaced_finetune/student_metrics.json

device: cuda
output_dir: ../runs/base
