# P06-E0: exercise the real ImageNet Arrow data, CLIP cache and P05 source.
output_dir: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p06_imagenet_smoke
imagenet_config: experiments/optical_mlp_mixer_moe9_imagenet1k_clip_distill/configs/imagenet1k.json
architecture_config: experiments/d2nn_cifar10_high_performance_optical_backbone/configs/formal_a13_high_performance.yaml
source_checkpoint: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p05_misalignment_vaccination/seed_2026/best.pt
source_checkpoint_sha256: 5bd7889700f16eae112776f622b10cd52e59c064384558d85ae7be999b1aa8aa

model:
  # Zero-based 1/3/5/7 are physical stages 2/4/6/8.
  selected_stage_indices: [1, 3, 5, 7]
  pool_size: 4
  projection_dim: 512
  num_classes: 1000

loss:
  supervised_ce_weight: 0.5
  feature_cosine_weight: 1.0
  clip_logit_kd_weight: 0.5
  distill_temperature: 2.0
  label_smoothing: 0.1

optimizer:
  phase_learning_rate: 1.0e-4
  residual_learning_rate: 1.0e-4
  head_learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  gradient_clip_norm: 5.0
  warmup_steps: 2
  minimum_learning_rate_ratio: 0.05

training:
  seed: 2026
  head_warmup_epochs: 1
  joint_epochs: 1
  train_samples_per_class: 1
  validation_samples_per_class: 1
  batch_size: 4
  validation_batch_size: 4
  num_workers: 2
  persistent_workers: false
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  log_interval_batches: 1
  checkpoint_interval_epochs: 1
  max_train_batches: 2
  max_validation_batches: 2
  run_final_ablations: true

gates:
  # Smoke is judged by data/gradient correctness, not statistical accuracy.
  validation_top1_min: 0.0
  clip_cosine_min: -1.0
  optical_gate_min: 0.5
  optical_disruption_relative_drop_min: -1.0
