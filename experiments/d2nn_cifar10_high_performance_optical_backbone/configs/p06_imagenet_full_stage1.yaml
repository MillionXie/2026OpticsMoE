# P06-F1: expand the validated compact backbone from 100k to all ImageNet train images.
output_dir: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p06_imagenet_full_stage1
imagenet_config: experiments/optical_mlp_mixer_moe9_imagenet1k_clip_distill/configs/imagenet1k.json
architecture_config: experiments/d2nn_cifar10_high_performance_optical_backbone/configs/formal_a13_high_performance.yaml
source_checkpoint: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p05_misalignment_vaccination/seed_2026/best.pt
source_checkpoint_sha256: 5bd7889700f16eae112776f622b10cd52e59c064384558d85ae7be999b1aa8aa
initial_checkpoint: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p06_imagenet_100k_balanced_refine/checkpoints/best.pt
initial_checkpoint_sha256: 590eb01c55498596f4784750084cef7fd37762d67d14cd6581ffb2e65e94f8b1

model:
  selected_stage_indices: [1, 3, 5, 7]
  pool_size: 4
  projection_dim: 512
  num_classes: 1000

loss:
  supervised_ce_weight: 1.0
  feature_cosine_weight: 1.0
  clip_logit_kd_weight: 0.5
  contrastive_weight: 0.1
  contrastive_temperature: 0.07
  distill_temperature: 2.0
  label_smoothing: 0.1

optimizer:
  phase_learning_rate: 3.0e-5
  residual_learning_rate: 3.0e-5
  head_learning_rate: 1.5e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  gradient_clip_norm: 5.0
  warmup_steps: 1000
  minimum_learning_rate_ratio: 0.10

training:
  seed: 2026
  head_warmup_epochs: 0
  joint_epochs: 10
  # null means every one of the 1,281,167 base train images, with one of the
  # four cached deterministic views selected per epoch.
  train_samples_per_class: null
  # All 50 validation images per ImageNet class.
  validation_samples_per_class: 50
  batch_size: 32
  validation_batch_size: 64
  num_workers: 6
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  # The HF train split is already class-shuffled. Shuffle 4096-image blocks
  # instead of individual rows so Arrow/image bytes are read sequentially.
  shuffle_block_size: 4096
  use_amp: true
  log_interval_batches: 500
  checkpoint_interval_epochs: 1
  max_train_batches: null
  max_validation_batches: null
  run_final_ablations: true

gates:
  validation_top1_min: 0.10
  clip_cosine_min: 0.65
  optical_gate_min: 0.50
  optical_disruption_relative_drop_min: 0.30
