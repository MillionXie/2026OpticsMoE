# P06-F3B: decouple supervised classification from the CLIP projection while
# keeping the exact same 8x224 million-phase optical backbone.
output_dir: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p06_imagenet_8x224_full_decoupled_mlp
imagenet_config: experiments/optical_mlp_mixer_moe9_imagenet1k_clip_distill/configs/imagenet1k.json
architecture_config: experiments/d2nn_cifar10_high_performance_optical_backbone/configs/imagenet_capacity_8x224.yaml
source_checkpoint: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p05_misalignment_vaccination/seed_2026/best.pt
source_checkpoint_sha256: 5bd7889700f16eae112776f622b10cd52e59c064384558d85ae7be999b1aa8aa
source_checkpoint_load_mode: integrity_only
initial_checkpoint: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/p06_imagenet_8x224_full_spatial/checkpoints/epoch_004.pt
initial_checkpoint_sha256: 7ac0c05d2d2dba9ef71e058ea8031671858094ae2a1eac702aa48a3b0520fa1d
initial_checkpoint_load_mode: compatible
model:
  selected_stage_indices: [1, 3, 5, 7]
  pool_size: 8
  projection_dim: 512
  num_classes: 1000
  classifier_mode: descriptor_mlp
  # 1536->256->1000 plus the CLIP projector keeps residual+head below 2M.
  classifier_hidden_dim: 256
  classifier_dropout: 0.1
loss:
  supervised_ce_weight: 2.0
  feature_cosine_weight: 0.5
  clip_logit_kd_weight: 0.25
  contrastive_weight: 0.05
  contrastive_temperature: 0.07
  distill_temperature: 2.0
  label_smoothing: 0.1
optimizer:
  phase_learning_rate: 1.5e-5
  residual_learning_rate: 7.5e-6
  head_learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  gradient_clip_norm: 5.0
  warmup_steps: 1000
  minimum_learning_rate_ratio: 0.2
training:
  seed: 2026
  head_warmup_epochs: 1
  joint_epochs: 4
  train_samples_per_class: null
  validation_samples_per_class: 50
  batch_size: 32
  validation_batch_size: 64
  num_workers: 6
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle_block_size: 4096
  use_amp: true
  amp_initial_scale: 256
  amp_growth_interval: 100000
  log_interval_batches: 250
  checkpoint_interval_epochs: 1
  max_train_batches: null
  max_validation_batches: null
  run_final_ablations: true
gates:
  validation_top1_min: 0.10
  clip_cosine_min: 0.65
  optical_gate_min: 0.5
  optical_disruption_relative_drop_min: 0.3
