output_dir: experiments/d2nn_cifar10_high_performance_optical_backbone/runs/smoke

optical:
  canvas_size: 32
  input_channels: 3
  num_stages: 2
  wavelength_m: 5.32e-7
  pixel_size_m: 1.6e-5
  propagation_distance_m: 0.05
  phase_init_std: 0.05
  layernorm_eps: 1.0e-5
  normalize_branch_rms: true
  residual:
    mode: constrained
    main_init: 0.50
    main_min: 0.35
  readout:
    pool_size: 4
    hidden_dim: 32
    dropout: 0.0

data:
  dataset: cifar10
  root: data/cifar100_fixed_feedback/torchvision
  validation_per_class: 500
  split_seed: 42
  num_workers: 0
  pin_memory: false
  augmentation:
    crop_padding: 4
    horizontal_flip: true

optimizer:
  phase_learning_rate: 0.003
  residual_learning_rate: 0.001
  electronic_learning_rate: 0.001
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  warmup_epochs: 0
  min_learning_rate_ratio: 0.05

training:
  epochs: 1
  seeds: [1234]
  batch_size: 4
  evaluation_batch_size: 4
  label_smoothing: 0.10
  use_amp: false
  log_interval_batches: 1
  checkpoint_interval_epochs: 1
  gradient_clip_norm: 5.0
  max_train_batches: 2
  max_evaluation_batches: 2
  init_checkpoint: ""
  load_backbone_only: false
